<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 퀴즈</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAFAFB;
  --bg-alt: #F1F2F6;
  --surface: #FFFFFF;
  --text: #0B0C10;
  --text-secondary: #5B5F6B;
  --text-tertiary: #9498A3;
  --accent: #3654F4;
  --accent-dark: #1E2FB0;
  --accent-soft: #EAEDFE;
  --border: #E4E6ED;
  --border-strong: #D3D6E0;
  --font-display: 'Pretendard Variable','Pretendard',-apple-system,sans-serif;
  --font-mono: 'JetBrains Mono',monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: var(--font-display);
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

.screen { display: none; width: 100%; height: 100vh; align-items: center; justify-content: center; flex-direction: column; }
.screen.active { display: flex; }

/* 로그인 */
.login-box { background: var(--surface); border: 1px solid var(--border); box-shadow: 0 12px 32px -12px rgba(11,12,16,0.12); border-radius: 20px; padding: 40px 50px; text-align: center; max-width: 720px; }
.login-box h1 { margin: 0 0 6px; font-size: 32px; font-weight: 800; letter-spacing: -0.01em; }
.subtitle { opacity: 0.7; color: var(--text-secondary); margin-bottom: 24px; }
#nickname-input { width: 260px; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--border-strong); background: var(--bg); color: var(--text); font-size: 16px; margin-bottom: 12px; outline: none; }
#nickname-input:focus { border-color: var(--accent); }

.room-select { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
@media (max-width: 560px) {
  .room-select { grid-template-columns: repeat(2, 1fr); }
}
.room-btn {
  flex: 1; min-width: 130px; background: var(--bg-alt); border: 2px solid var(--border);
  border-radius: 14px; padding: 14px 10px; cursor: pointer; color: var(--text); text-align: center;
  display: flex; flex-direction: column; gap: 4px; transition: all 0.15s ease;
}
.room-btn:hover { border-color: var(--border-strong); background: var(--surface); }
.room-btn.selected { border-color: var(--accent); background: var(--accent-soft); }
.room-btn .room-emoji { font-size: 26px; }
.room-btn .room-name { font-weight: 700; font-size: 15px; }
.room-btn .room-desc { font-size: 11px; opacity: 0.65; color: var(--text-secondary); }
#btn-join, .btn-join-copy, #btn-start, #btn-restart { padding: 12px 28px; border-radius: 999px; border: none; background: var(--text); color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; transition: transform 0.25s cubic-bezier(.22,1,.36,1), box-shadow 0.25s, background 0.25s; }
#btn-join:hover, .btn-join-copy:hover, #btn-start:hover:not(:disabled), #btn-restart:hover:not(:disabled) { background: var(--accent); transform: translateY(-2px); box-shadow: 0 10px 24px -8px rgba(54,84,244,.45); }
.error-msg { color: #E1483D; min-height: 20px; margin-top: 10px; font-size: 14px; }

/* 대기실 */
#screen-waiting { align-items: center; }
.waiting-header { text-align: center; margin-bottom: 10px; }
.waiting-header h2 { margin: 6px 0; font-weight: 800; }
.hidden { display: none !important; }
.hint { opacity: 0.65; color: var(--text-secondary); font-size: 13px; }
.lang-select { display: flex; align-items: center; gap: 8px; justify-content: center; margin: 8px 0 4px; font-size: 13px; }
.lang-select-label { opacity: 0.65; color: var(--text-secondary); }
.lang-btn { background: var(--bg-alt); color: var(--text); border: 1.5px solid var(--border); border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
.lang-btn.selected { background: var(--accent); color: #fff; font-weight: 700; border-color: var(--accent); }
.lang-btn:disabled { cursor: default; opacity: 0.7; }
.waiting-grid { width: 90%; max-width: 1400px; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; max-height: 70vh; overflow-y: auto; padding: 10px; }
.waiting-card { background: var(--surface); border-radius: 12px; padding: 10px 4px; text-align: center; border: 1px solid var(--border); }
.waiting-card .emoji { font-size: 30px; }
.waiting-card .name { font-size: 12px; margin-top: 4px; word-break: break-all; }
.waiting-card .host-badge { font-size: 10px; color: var(--accent); font-weight: 700; margin-top: 2px; }

/* 게임 화면 */
#screen-game { flex-direction: column; padding: 10px 0 0; position: relative; }
.ranking-toggle { position: fixed; top: 12px; left: 14px; z-index: 30; background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 14px; font-size: 13px; cursor: pointer; box-shadow: 0 4px 12px -6px rgba(11,12,16,0.15); }
.ranking-toggle:hover { border-color: var(--accent); color: var(--accent); }
.give-up-btn { position: fixed; top: 12px; right: 14px; z-index: 30; background: #FFF0EE; color: #C7382C; border: 1px solid #F3C3BC; border-radius: 10px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
.give-up-btn:hover { background: #FFE3DF; }
.back-button { position: fixed; top: 12px; left: 14px; z-index: 30; background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 14px; font-size: 13px; cursor: pointer; box-shadow: 0 4px 12px -6px rgba(11,12,16,0.15); }
.back-button:hover { border-color: var(--accent); color: var(--accent); }
.stage { position: relative; width: 96%; max-width: 1700px; height: 62vh; margin: 0 auto; background: linear-gradient(180deg, #EEF2FF 0%, #DCE4FB 100%); border-radius: 16px; overflow: hidden; border: 1px solid var(--border); }
.water-line { position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: linear-gradient(180deg, #6E8CFA 0%, var(--accent-dark) 100%); border-top: 3px solid var(--accent); }
.players-layer { position: absolute; inset: 0; }
.player-token { position: absolute; width: 60px; text-align: center; transition: top 0.7s cubic-bezier(.4,1.4,.6,1), opacity 0.6s ease, transform 0.6s ease; transform: translate(-50%, 0); }
.player-token .emoji { font-size: 28px; filter: drop-shadow(0 2px 2px rgba(11,12,16,0.25)); }
.player-token .name { font-size: 10px; background: rgba(11,12,16,0.75); color: #fff; border-radius: 6px; padding: 1px 4px; margin-top: 2px; display: inline-block; max-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player-token.me .name { background: var(--accent); color: #fff; font-weight: 700; }
.player-token.wrong-flash .emoji { animation: shake 0.4s; }
.player-token.correct-flash .emoji { animation: pop 0.4s; }
.player-token.eliminated { opacity: 0.25; transform: translate(-50%, 20px) scale(0.8); }
.player-token.first-bonus .emoji { animation: bonusGlow 0.7s ease; }
@keyframes bonusGlow {
  0% { filter: drop-shadow(0 2px 2px rgba(11,12,16,0.25)); transform: scale(1); }
  40% { filter: drop-shadow(0 0 14px var(--accent)); transform: scale(1.5); }
  100% { filter: drop-shadow(0 2px 2px rgba(11,12,16,0.25)); transform: scale(1); }
}
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1); } }

/* 카운트다운 */
.countdown-overlay { position: absolute; inset: 0; display:flex; align-items:center; justify-content:center; background: rgba(11,12,16,0.35); z-index: 50; }
.countdown-overlay.hidden { display: none; }
#countdown-number { font-family: var(--font-mono); font-size: 120px; font-weight: 900; color: #fff; text-shadow: 0 4px 14px rgba(11,12,16,0.4); }
#countdown-number.pop { animation: countdownPop 0.7s ease; }
@keyframes countdownPop { 0% { transform: scale(0.4); opacity:0; } 30% { transform: scale(1.15); opacity:1; } 100% { transform: scale(1); opacity:1; } }

.quiz-panel { width: 96%; max-width: 900px; margin: 14px auto 0; background: var(--surface); border-radius: 16px; padding: 16px 28px 22px; text-align: center; border: 1px solid var(--border); box-shadow: 0 8px 24px -14px rgba(11,12,16,0.15); }
.quiz-top { display: flex; justify-content: space-between; font-size: 14px; color: var(--text-secondary); margin-bottom: 6px; }
#timer-bar-wrap { width: 100%; height: 8px; background: var(--bg-alt); border-radius: 6px; overflow: hidden; margin-bottom: 14px; }
#timer-bar { height: 100%; width: 100%; background: var(--accent); transition: width 0.15s linear, background 0.3s; }
#word-display { font-family: var(--font-mono); font-size: 40px; font-weight: 800; letter-spacing: 2px; margin-bottom: 14px; min-height: 50px; line-height: 1.3; word-break: keep-all; color: var(--text); }
#word-display.quiz-mode { font-family: var(--font-display); font-size: 26px; letter-spacing: 0; font-weight: 700; }
.chain-hint { font-size: 14px; color: var(--text-secondary); margin: -6px 0 10px; }
.chain-hint b { color: var(--accent); font-size: 18px; }
#answer-input { width: 90%; max-width: 400px; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--border-strong); background: var(--bg); color: var(--text); font-size: 18px; text-align: center; outline: none; }
#answer-input:focus { border-color: var(--accent); }
#answer-feedback { min-height: 20px; margin-top: 8px; font-size: 14px; }
#answer-feedback.correct { color: #1FA24A; }
#answer-feedback.wrong { color: #E1483D; }

/* 결과 */
.result-box { text-align: center; max-height: 92vh; overflow-y: auto; padding: 0 12px; }
.result-sub { font-size: 20px; color: var(--text-secondary); margin-bottom: 8px; }
.winner-animal { font-size: 90px; margin-bottom: 6px; }
#winner-name { font-size: 56px; margin: 0 0 24px; color: var(--accent); font-weight: 800; }
#btn-restart:disabled { opacity: 0.4; cursor: not-allowed; }
.back-to-waiting-btn { display: block; margin: 14px auto 0; padding: 10px 22px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 14px; cursor: pointer; }
.back-to-waiting-btn:hover { border-color: var(--accent); color: var(--accent); }
.result-ranking-wrap { margin: 6px 0 20px; }
.result-ranking-wrap h3 { font-size: 15px; color: var(--text-secondary); margin-bottom: 8px; }

/* 일시정지 / 순위 오버레이 */
.pause-overlay { position: fixed; inset: 0; background: rgba(11,12,16,0.5); display:flex; align-items:center; justify-content:center; z-index: 999; }
.pause-overlay.hidden { display: none; }
.pause-box { background: var(--surface); border: 1px solid var(--border); box-shadow: 0 20px 48px -16px rgba(11,12,16,0.35); border-radius: 18px; padding: 34px 46px; text-align: center; }
.pause-box h2 { margin: 0 0 18px; font-size: 26px; color: var(--text); }
.pause-box button { display: block; width: 220px; margin: 10px auto 0; padding: 13px; border-radius: 999px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; transition: transform 0.25s cubic-bezier(.22,1,.36,1); }
.pause-box button:hover { transform: translateY(-2px); }
.pause-box .exit-main { background: #E1483D; color: #fff; }
.pause-box .exit-sub { background: var(--bg-alt); color: var(--text); border: 1px solid var(--border); }
#btn-resume { background: #1FA24A; color: #fff; }
#btn-restart-mid { background: #E1483D; color: #fff; }

.ranking-box { max-width: 420px; }
.ranking-list { max-height: 46vh; overflow-y: auto; width: 320px; max-width: 80vw; margin: 0 auto; text-align: left; padding-right: 4px; }
.ranking-row { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; margin-bottom: 5px; background: var(--bg-alt); border: 1px solid var(--border); font-size: 14px; }
.ranking-row .rank-num { width: 26px; font-weight: 800; text-align: center; flex-shrink: 0; color: var(--text); }
.ranking-row .rank-emoji { font-size: 20px; flex-shrink: 0; }
.ranking-row .rank-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.ranking-row .rank-correct { font-size: 11px; color: #1FA24A; flex-shrink: 0; }
.ranking-row .rank-status { font-size: 11px; color: var(--text-tertiary); flex-shrink: 0; }
.ranking-row.me { border: 1.5px solid var(--accent); }
.ranking-row.rank-1 { background: var(--accent-soft); }

/* 채팅창 (우측 하단, 작게) */
.chat-box {
  position: fixed; right: 14px; bottom: 14px; width: 260px; z-index: 200;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 12px 32px -14px rgba(11,12,16,0.25);
}
.chat-box.hidden { display: none !important; }
.chat-header {
  display: flex; justify-content: space-between; align-items: center; padding: 8px 12px;
  background: var(--bg-alt); color: var(--text); font-size: 13px; font-weight: 700; cursor: pointer;
}
.chat-header button { background: none; border: none; color: var(--text); font-size: 14px; cursor: pointer; padding: 0 4px; }
.chat-messages { height: 160px; overflow-y: auto; padding: 8px 10px; font-size: 12px; color: var(--text); display: flex; flex-direction: column; gap: 4px; }
.chat-messages.collapsed { display: none; }
.chat-input-row.collapsed { display: none; }
.chat-msg { line-height: 1.4; word-break: break-word; }
.chat-msg .chat-name { font-weight: 700; color: var(--accent); margin-right: 4px; }
.chat-msg.me .chat-name { color: #1FA24A; }
.chat-input-row { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--border); }
#chat-input { flex: 1; min-width: 0; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); font-size: 12px; outline: none; }
#chat-input:focus { border-color: var(--accent); }
#chat-send { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 7px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }

/* 1920x1080 등 넓은 화면 최적화 */
@media (min-width: 1600px) {
  .stage { max-width: 1800px; height: 64vh; }
  .quiz-panel { max-width: 960px; }
  .waiting-grid { max-width: 1600px; }
  .login-box { padding: 48px 64px; }
  #word-display { font-size: 46px; }
  #word-display.quiz-mode { font-size: 30px; }
  #answer-input { font-size: 20px; padding: 14px 16px; }
  .player-token { width: 76px; }
  .player-token .emoji { font-size: 34px; }
  .player-token .name { font-size: 11px; max-width: 76px; padding: 2px 5px; }
  .winner-animal { font-size: 110px; }
  #winner-name { font-size: 60px; }
}

.subject-title { text-align: left; font-size: 13px; font-weight: 700; color: var(--text-secondary); margin: 4px 0 8px; }
.subject-select { grid-template-columns: repeat(5, 1fr); }
.subject-btn .room-name { word-break: keep-all; }
.unit-picker { background: var(--bg-alt); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin: -6px 0 18px; text-align: left; }
.grade-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
.grade-tabs button { flex: 1; border: 1.5px solid var(--border-strong); background: var(--surface); color: var(--text-secondary); font: inherit; font-size: 14px; font-weight: 700; padding: 8px 0; border-radius: 10px; cursor: pointer; }
.grade-tabs.top { margin-bottom: 16px; }
.grade-tabs.top button { font-size: 16px; padding: 12px 0; border-radius: 12px; }
.subject-btn .room-desc { font-size: 10.5px; word-break: keep-all; }
.grade-tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.unit-course { margin: 2px 0 8px; font-size: 13px; color: var(--text-secondary); }
.unit-course b { color: var(--text); }
.unit-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.unit-chips button { border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
.unit-chips button small { color: var(--text-tertiary); margin-left: 4px; font-family: var(--font-mono); font-size: 11px; }
.unit-chips button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.subject-btn { min-width: 0; padding: 12px 6px; }
.subject-btn .room-emoji { font-size: 22px; }
.subject-btn .room-name { font-size: 14px; }
@media (max-width: 560px) { .subject-select { grid-template-columns: repeat(3, 1fr); } }
.login-box { max-height: 96vh; overflow-y: auto; }
.custom-btn { border-style: dashed; }
/* 선생님용 편집기 */
.login-box { width: min(720px, calc(100vw - 32px)); }
@media (max-width: 560px) { .login-box { padding: 28px 18px; } }
.join-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.join-row-bottom { margin-top: 22px; }
#login-error { margin: 6px 0 14px; min-height: 18px; }
#btn-multi, .btn-multi-copy { padding: 12px 24px; border-radius: 999px; border: 1.5px solid var(--border-strong); background: var(--surface); color: var(--text); font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; transition: transform 0.25s cubic-bezier(.22,1,.36,1), border-color 0.25s, color 0.25s; }
#btn-multi:hover, .btn-multi-copy:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
.solo-note { font-size: 12px; color: var(--text-tertiary); margin: -12px 0 16px; }
.bot-select { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 8px 0 4px; font-size: 13px; }
.bot-select button { width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 16px; font-weight: 700; cursor: pointer; }
.bot-select button:hover { border-color: var(--accent); color: var(--accent); }
.bot-select #bot-count { min-width: 28px; text-align: center; font-weight: 800; font-family: var(--font-mono); }
.waiting-card.bot .name::after { content: ' 🤖'; font-size: 9px; }
.reveal-answer { color: #5B5F6B !important; }
</style>
</head>
<body>

  <!-- 로그인 -->
  <section id="screen-login" class="screen active">
    <div class="login-box">
      <h1>AI 퀴즈</h1>
      <div id="student-panel">
      <p class="subtitle">닉네임을 입력하고 학년과 과목을 선택하세요</p>
      <p class="solo-note">다른 참가자는 컴퓨터(봇)가 대신합니다</p>
      <input id="nickname-input" maxlength="10" placeholder="닉네임 (최대 10자)" autocomplete="off" />

      <p class="subject-title">🎓 학년 선택</p>
      <div id="grade-tabs" class="grade-tabs top"></div>
      <p class="subject-title">📚 과목 선택</p>
      <div id="subject-grid" class="room-select subject-select"></div>
      <div id="unit-picker" class="unit-picker hidden">
        <p id="unit-course" class="unit-course"></p>
        <div id="unit-chips" class="unit-chips"></div>
      </div>
      <div id="custom-wrap" class="hidden">
        <p class="subject-title">✏️ 선생님 문제</p>
        <div id="custom-select" class="room-select subject-select"></div>
      </div>
      <div class="join-row">
        <button id="btn-join">🙋 혼자 입장하기</button>
        <button id="btn-multi" title="친구들과 실시간으로 함께하기">👥 멀티플레이</button>
      </div>
      <p id="login-error" class="error-msg"></p>

      </div>
    </div>
  </section>

  <!-- 대기실 -->
  <section id="screen-waiting" class="screen">
    <button id="btn-back-to-login" class="back-button">← 처음으로</button>
    <div class="waiting-header">
      <h2><span id="waiting-room-label"></span> 대기실 <span id="waiting-count">(0/35)</span></h2>
      <div id="lang-select" class="lang-select hidden">
        <span class="lang-select-label">단어 언어:</span>
        <button class="lang-btn selected" id="lang-btn-en">English</button>
        <button class="lang-btn" id="lang-btn-kr">한글</button>
      </div>
      <div class="bot-select">
        <span class="lang-select-label">함께할 봇:</span>
        <button id="bot-minus">−</button><span id="bot-count">14</span>명<button id="bot-plus">＋</button>
      </div>
      <button id="btn-start">게임 시작</button>
    </div>
    <div id="waiting-grid" class="waiting-grid"></div>
  </section>

  <!-- 게임 화면 -->
  <section id="screen-game" class="screen">
    <button id="btn-ranking-toggle" class="ranking-toggle">🏆 순위</button>
    <button id="btn-give-up" class="give-up-btn">🚪 나가기</button>
    <div id="stage" class="stage">
      <div id="water-line" class="water-line"></div>
      <div id="players-layer" class="players-layer"></div>
      <div id="countdown-overlay" class="countdown-overlay hidden">
        <div id="countdown-number">3</div>
      </div>
    </div>
    <div class="quiz-panel">

// ---------- 교과 퀴즈 엔진 ----------
function toChosung(str) {
  const CH = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  return [...str].map(c => {
    const code = c.charCodeAt(0) - 0xAC00;
    return (code >= 0 && code < 11172) ? CH[Math.floor(code / 588)] : c;
  }).join('');
}
function curriculumQuestion(line) {
  const parts = line.split('|');
  const question = parts[0].trim();
  const answers = parts.slice(1).map(s => s.trim()).filter(Boolean);
  const first = answers[0] || '';
  let hint = '';
  if (/[가-힣]/.test(first)) hint = ' ' + toChosung(first.replace(/\s+/g, ''));
  else if (/^[a-z][a-z ]+$/.test(first) && !/\(/.test(question)) hint = ' (' + first[0] + '로 시작, ' + first.replace(/ /g, '').length + '글자)';
  return { question: question + hint, answer: answers.length > 1 ? answers : first };
}
function unitBank(unit) {
  const data = unit[1];
  if (typeof data === 'string') return (typeof window[data] !== 'undefined' ? window[data] : eval(data)) || [];
  return data.map(curriculumQuestion);
}

function getRoundTime(round) {
  if (round <= 10) return 5;

}

const CHAIN_INDEX = {};
WORDCHAIN_DICTIONARY.forEach(w => { if (w.length >= 2 && /^[가-힣]+$/.test(w)) (CHAIN_INDEX[w[0]] = CHAIN_INDEX[w[0]] || []).push(w); });

function checkChainWord(chainWord, usedWords, raw) {
  const w = (raw || '').toString().trim();
  if (w.length < 2) return { ok: false, reason: '두 글자 이상 입력해야 해요.' };
  if (!/^[가-힣]+$/.test(w)) return { ok: false, reason: '한글 단어만 입력할 수 있어요.' };
  const lastChar = chainWord[chainWord.length - 1];
  if (w[0] !== lastChar) return { ok: false, reason: `"${lastChar}"(으)로 시작해야 해요.` };
  if (usedWords.has(w)) return { ok: false, reason: '이미 나온 단어예요.' };
  if (!DICT_SET.has(w)) return { ok: false, reason: '사전에 없는 단어예요.' };
  return { ok: true, word: w };
}

// ---------- 사운드 (Web Audio API) ----------
const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function ensureAudio() {
  try {
    if (!audioCtx) audioCtx = new AudioCtxClass();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
function playTone(freq, duration, type, volume, delay) {
  if (!audioCtx) return;
  delay = delay || 0;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = type || 'sine'; osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0 + duration + 0.02);
}
function playCountdownBeep(n) { playTone(n === 1 ? 880 : (n === 2 ? 659 : 523), 0.22, 'square', 0.3); }
function playCorrectSound() { playTone(784.0, 0.14, 'sine', 0.28, 0); playTone(1046.5, 0.2, 'sine', 0.28, 0.11); }
function playFallSound() {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(520, t0);
  osc.frequency.exponentialRampToValueAtTime(90, t0 + 0.35);
  gain.gain.setValueAtTime(0.25, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.4);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0 + 0.42);
}
function playSplashSound() {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime;
  const size = Math.floor(audioCtx.sampleRate * 0.3);
  const buffer = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < size; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / size);
  const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.3, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.3);
  const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 700;
  noise.connect(filter).connect(gain).connect(audioCtx.destination);
  noise.start(t0);
}

}

function tId() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function registerCustomRooms() {
  Object.keys(ROOMS).forEach(k => { if (k.startsWith('custom:')) delete ROOMS[k]; });
  const wrap = $('custom-wrap'), box = $('custom-select');
  box.innerHTML = '';

    const key = 'custom:' + set.id;

function decodeSet(str) {

}

  langBtnKr.classList.toggle('selected', wordLanguage === 'kr');
}
langBtnEn.addEventListener('click', () => { wordLanguage = 'en'; renderWaitingRoom(); });
langBtnKr.addEventListener('click', () => { wordLanguage = 'kr'; renderWaitingRoom(); });
$('bot-minus').addEventListener('click', () => { if (botCount > 1) { botCount--; buildPlayers(); renderWaitingRoom(); } });
$('bot-plus').addEventListener('click', () => { if (botCount < MAX_PLAYERS - 1) { botCount++; buildPlayers(); renderWaitingRoom(); } });

$('btn-back-to-login').addEventListener('click', () => {
  stopLoop(); resetPauseState();
  G = null;
  nicknameInput.value = ''; loginError.textContent = '';
  showScreen('login');
});
btnStart.addEventListener('click', () => { ensureAudio(); startGame(); });

// ---------- 게임 진행 ----------
let loopId = null;
function startLoop() { stopLoop(); loopId = setInterval(tick, 50); }
function stopLoop() { clearInterval(loopId); loopId = null; }

const activePlayers = () => Object.values(G.players).filter(p => !p.eliminated);
const me = () => G.players.me;
// 내가 탈락한 뒤에는 관전 중이므로 진행을 빠르게 합니다.
const spectating = () => me().eliminated;
const cdStepMs = () => spectating() ? 250 : COUNTDOWN_STEP_MS;
const resultDelay = () => spectating() ? 650 : NEXT_ROUND_DELAY;

function computeRanking() {
  return Object.values(G.players).slice().sort((a, b) => {
    if (a.eliminated !== b.eliminated) return a.eliminated ? 1 : -1;
    if (!a.eliminated) {
      if (a.row !== b.row) return a.row - b.row;
      return a.wrongCount - b.wrongCount;
    }
    return (b.eliminatedAt || 0) - (a.eliminatedAt || 0);
  });
}

function startGame() {
  resetPauseState();
  G.round = 0; G.eliminationCounter = 0;
  Object.values(G.players).forEach(p => { p.row = START_ROW; p.wrongCount = 0; p.correctCount = 0; p.eliminated = false; p.eliminatedAt = null; p.plan = null; });
  if (G.mode === 'quiz') G.quizOrder = shuffle(G.bank.map((_, i) => i));
  if (G.mode === 'wordchain') {
    G.usedWords = new Set();
    G.chainWord = pick(WORDCHAIN_SEED_WORDS);
    G.usedWords.add(G.chainWord);
  }
  G.order = shuffle(Object.keys(G.players));
  buildPlayerTokens();
  showScreen('game');
  startLoop();
  beginRound();
}

function rowToTopPercent(row) {
  const usable = 100 - STAGE_TOP_PAD - STAGE_BOTTOM_PAD;
  return Math.max(0, Math.min(100, STAGE_TOP_PAD + (row / MAX_ROW) * usable));
}
function buildPlayerTokens() {
  playersLayer.innerHTML = '';
  const n = G.order.length;
  G.order.forEach((id, idx) => {
    const p = G.players[id];
    const token = document.createElement('div');
    token.className = 'player-token' + (id === 'me' ? ' me' : '');
    token.id = 'token-' + id;
    token.style.left = (((idx + 0.5) / n) * 100) + '%';
    token.style.top = rowToTopPercent(p.row) + '%';
    token.innerHTML = `<div class="emoji">${p.animal.emoji}</div><div class="name">${escapeHtml(p.nickname)}</div>`;
    playersLayer.appendChild(token);
  });
}
const formatRoundLabel = r => G.quizTotal ? `문제 ${r}/${G.quizTotal}` : `라운드 ${r}`;

function beginRound() {
  const active = activePlayers();
  if (active.length <= 1) { endGame(active[0] || null); return; }
  if (G.mode === 'quiz' && G.round >= G.quizTotal) { endGame(computeRanking()[0]); return; }
  G.round++;
  G.roundAnswered = {};
  G.gameState = 'countdown';
  G.cdStep = 3;
  G.cdStart = vNow();

  alreadyAnswered = false;
  timerBar.style.width = '0%';
  wordDisplay.textContent = '';
  chainHintEl.classList.add('hidden');
  answerFeedback.textContent = ''; answerFeedback.className = '';
  answerInput.value = ''; answerInput.disabled = true;
  roundLabel.textContent = formatRoundLabel(G.round);
  aliveLabel.textContent = `생존 ${active.length}명`;
  showCountdown(3);
}
function showCountdown(n) {
  countdownOverlay.classList.remove('hidden');
  countdownNumberEl.textContent = n;
  countdownNumberEl.classList.remove('pop');
  void countdownNumberEl.offsetWidth;
  countdownNumberEl.classList.add('pop');
  playCountdownBeep(n);
}

function startQuestionPhase() {
  G.gameState = 'question';
  G.roundWinner = null;
  if (G.mode === 'quiz') {
    const q = G.bank[G.quizOrder[(G.round - 1) % G.quizOrder.length]];
    G.answerList = (Array.isArray(q.answer) ? q.answer : [q.answer]).filter(Boolean);
    G.questionText = q.question;
  } else if (G.mode === 'wordchain') {
    G.answerList = [];
    G.questionText = G.chainWord;
  } else {
    const pool = wordLanguage === 'kr' ? WORDS_KR : WORDS;
    const w = pick(pool);
    G.answerList = [w];
    G.questionText = w;
  }
  G.roundTime = G.fixed || getRoundTime(G.round);
  G.deadline = vNow() + G.roundTime * 1000;
  G.firstAwarded = false;
  planBots();

  countdownOverlay.classList.add('hidden');
  roundLabel.textContent = formatRoundLabel(G.round);
  aliveLabel.textContent = `생존 ${activePlayers().length}명`;
  wordDisplay.textContent = G.questionText;
  wordDisplay.classList.toggle('quiz-mode', !!G.quizTotal);
  answerFeedback.textContent = ''; answerFeedback.className = '';
  answerInput.value = '';
  alreadyAnswered = false;
  if (G.mode === 'wordchain') {
    const last = G.chainWord[G.chainWord.length - 1];
    chainHintEl.innerHTML = `<b>"${escapeHtml(last)}"</b>(으)로 시작하는 단어를 가장 먼저 입력하세요!`;
    chainHintEl.classList.remove('hidden');
  } else chainHintEl.classList.add('hidden');

  if (me().eliminated) {
    answerInput.disabled = true;
    answerInput.placeholder = '탈락하여 관전 중입니다';
  } else {
    answerInput.disabled = false;
    answerInput.placeholder = '여기에 정답을 입력하세요';
    answerInput.focus();
  }
}

// ---- 봇: 각 라운드 시작 때 "언제, 무엇을" 제출할지 미리 계산 ----
function planBots() {
  const now = vNow();
  const limitMs = G.roundTime * 1000;
  const pressure = Math.min(1, G.roundTime / 4);       // 제한시간이 짧을수록 정확도 ↓
  const timeScale = spectating() ? 0.3 : 1;            // 관전 중에는 빠르게 진행
  Object.values(G.players).forEach(b => {
    b.plan = null;
    if (!b.isBot || b.eliminated) return;
    if (G.mode === 'wordchain') {
      const last = G.chainWord[G.chainWord.length - 1];
      const cands = (CHAIN_INDEX[last] || []).filter(w => !G.usedWords.has(w));
      const r = Math.random();
      let text = null;
      if (cands.length && r < b.acc * 0.55 * (0.5 + 0.5 * pressure)) text = pick(cands);
      else if (r > 0.9) text = '틀린말';
      if (text === null && !spectating()) return;      // 이번 라운드는 제출 안 함(시간초과)
      if (text === null) text = '틀린말';
      b.plan = { at: now + limitMs * rand(0.25, 0.92) * (b.speed + 0.4) * timeScale, text };
      return;
    }
    const effAcc = b.acc * (0.55 + 0.45 * pressure);
    const correct = Math.random() < effAcc;
    if (!spectating() && Math.random() < 0.04) return; // 가끔 아예 못 푸는 경우
    const t = Math.min(limitMs * 0.95, limitMs * (b.speed + rand(0, 0.28))) * timeScale;
    b.plan = { at: now + Math.max(250 * timeScale, t), text: correct ? G.answerList[0] : '__wrong__' };
  });
}

function tick() {
  if (!G || paused) { updateTimerBar(); return; }
  const now = vNow();
  if (G.gameState === 'countdown') {
    if (now - G.cdStart >= cdStepMs()) {
      if (G.cdStep > 1) { G.cdStep--; G.cdStart = now; showCountdown(G.cdStep); }
      else startQuestionPhase();
    }
  } else if (G.gameState === 'question') {
    const bots = Object.values(G.players).filter(p => p.isBot && !p.eliminated && p.plan && !G.roundAnswered[p.id]);
    bots.sort((a, b) => a.plan.at - b.plan.at);
    for (const b of bots) {
      if (G.gameState !== 'question') break;
      if (now >= b.plan.at) submitAnswerFor(b, b.plan.text);
    }
    if (G.gameState === 'question' && now >= G.deadline) finishRound();
  } else if (G.gameState === 'result') {
    if (now >= G.resultEnd) beginRound();
  }
  updateTimerBar();
}

function updateTimerBar() {
  if (!G || G.gameState !== 'question') return;
  const remain = Math.max(0, G.deadline - vNow());
  const pct = Math.max(0, (remain / (G.roundTime * 1000)) * 100);
  timerBar.style.width = pct + '%';
  timerBar.style.background = pct < 30 ? '#ff6b6b' : '#ffb347';
}

function applyAnswer(p, correct, extra) {
  let firstBonus = false;
  if (correct) {
    p.correctCount++;
    if (!G.firstAwarded) { G.firstAwarded = true; firstBonus = true; p.row -= 1.2; }
    else p.row -= 1;
  } else {
    p.wrongCount++;
    p.row = Math.min(p.row + 1, MAX_ROW);
    if (p.row >= MAX_ROW && !p.eliminated) { p.eliminated = true; p.eliminatedAt = ++G.eliminationCounter; }
  }
  onAnswerResult(Object.assign({
    id: p.id, correct, row: p.row, eliminated: p.eliminated, firstBonus,
    correctAnswer: G.mode === 'wordchain' ? null : G.answerList.join(' / '),
  }, extra || {}));
}

function submitAnswerFor(p, text) {
  if (G.gameState !== 'question' || p.eliminated || G.roundAnswered[p.id]) return;
  G.roundAnswered[p.id] = true;
  if (G.mode === 'wordchain') {
    const check = checkChainWord(G.chainWord, G.usedWords, text);
    if (check.ok) {
      G.usedWords.add(check.word);
      G.chainWord = check.word;
      G.roundWinner = { id: p.id, nickname: p.nickname, word: check.word };
      applyAnswer(p, true, { chainWord: check.word });
      finishRound();
    } else {
      applyAnswer(p, false, { reason: check.reason });
      maybeFinishEarly();
    }
    return;
  }
  const clean = v => (v || '').toString().replace(/[\s·.ㆍ]+/g, '').toLowerCase();
  const norm = clean(text);
  const correct = G.answerList.some(a => clean(a) === norm);
  applyAnswer(p, correct);
  maybeFinishEarly();
}
function maybeFinishEarly() {
  if (G.gameState !== 'question') return;
  if (activePlayers().every(p => G.roundAnswered[p.id])) finishRound();
}

function finishRound() {
  if (G.gameState !== 'question') return;
  G.gameState = 'result';
  const meWasOut = me().eliminated;
  activePlayers().forEach(p => {
    if (G.roundAnswered[p.id]) return;
    G.roundAnswered[p.id] = true;
    const extra = G.mode === 'wordchain' && G.roundWinner
      ? { chainWinnerNickname: G.roundWinner.nickname, chainWinnerWord: G.roundWinner.word } : undefined;
    applyAnswer(p, false, extra);
  });
  // 끝말잇기: 아무도 못 이었으면 새 시작 단어로 넘어갑니다.
  if (G.mode === 'wordchain' && !G.roundWinner) {
    G.chainWord = pick(WORDCHAIN_SEED_WORDS);
    G.usedWords.add(G.chainWord);
  }
  // 이미 탈락한 내가 관전 중일 때는 정답을 알려줍니다.
  if (meWasOut && G.mode !== 'wordchain') {
    answerFeedback.textContent = `정답: ${G.answerList.join(' / ')}`;
    answerFeedback.className = 'reveal-answer';
  } else if (meWasOut && G.roundWinner) {
    answerFeedback.textContent = `${G.roundWinner.nickname}님이 "${G.roundWinner.word}"(으)로 이었어요.`;
    answerFeedback.className = 'reveal-answer';
  }
  G.resultEnd = vNow() + resultDelay();
}

// 정답/오답이 확정되는 즉시 토큰 이동 + (내 결과면) 소리·메시지
function onAnswerResult({ id, correct, row, eliminated, firstBonus, correctAnswer, reason, chainWord, chainWinnerNickname, chainWinnerWord }) {
  const token = $('token-' + id);
  if (token) {
    token.style.top = rowToTopPercent(row) + '%';
    token.classList.remove('wrong-flash', 'correct-flash', 'first-bonus');
    void token.offsetWidth;
    token.classList.add(correct ? 'correct-flash' : 'wrong-flash');
    if (firstBonus) token.classList.add('first-bonus');
    if (eliminated) setTimeout(() => token.classList.add('eliminated'), 250);
  }
  aliveLabel.textContent = `생존 ${activePlayers().length}명`;
  if (id !== 'me') return;

  const fail = (msg) => {
    answerFeedback.textContent = msg; answerFeedback.className = 'wrong';
    playFallSound();
    if (eliminated) setTimeout(playSplashSound, 300);
  };
  if (G.mode === 'wordchain') {
    if (correct) {
      answerFeedback.textContent = `⚡ 성공! "${chainWord}" 로 이었어요! (위로 1.2칸 이동)`;
      answerFeedback.className = 'correct';
      playCorrectSound(); playBonusSound();
    } else if (reason) fail(`${reason} (아래로 한 칸 이동)`);
    else if (chainWinnerNickname) fail(`너무 늦었어요! ${chainWinnerNickname}님이 "${chainWinnerWord}"로 먼저 이었어요. (아래로 한 칸 이동)`);
    else fail('시간 초과! 아무도 다음 단어를 찾지 못했어요. (아래로 한 칸 이동)');
  } else if (correct && firstBonus) {
    answerFeedback.textContent = '⚡ 1등 정답! 1.2칸 이동!';
    answerFeedback.className = 'correct';
    playCorrectSound(); playBonusSound();
  } else if (correct) {
    answerFeedback.textContent = '정답입니다! 🎉 (위로 한 칸 이동)';
    answerFeedback.className = 'correct';
    playCorrectSound();
  } else fail(`오답! 정답은 "${correctAnswer}" 였습니다. (아래로 한 칸 이동)`);
}

// 내 입력 제출
answerInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitMine(); });
function submitMine() {
  if (!G || paused || alreadyAnswered || answerInput.disabled) return;
  const text = answerInput.value;
  if (!text) return;
  alreadyAnswered = true;
  answerInput.disabled = true;
  answerFeedback.textContent = '제출 완료! 결과를 기다리는 중...';
  answerFeedback.className = '';
  submitAnswerFor(me(), text);
}

// ---------- 종료 / 결과 ----------
function endGame(winner) {
  G.gameState = 'ended';
  stopLoop();
  resetPauseState();
  const ranking = computeRanking();
  if (winner) { $('winner-animal').textContent = winner.animal.emoji; $('winner-name').textContent = winner.nickname; }
  else { $('winner-animal').textContent = '🤝'; $('winner-name').textContent = '무승부 (생존자 없음)'; }
  renderRankingInto($('result-ranking-list'), ranking);
  showScreen('result');
}
function renderRankingInto(container, ranking) {
  container.innerHTML = '';
  ranking.forEach((p, idx) => {
    const row = document.createElement('div');
    row.className = 'ranking-row' + (p.id === 'me' ? ' me' : '') + (idx === 0 ? ' rank-1' : '');
    row.innerHTML = `
      <span class="rank-num">${idx + 1}</span>
      <span class="rank-emoji">${p.animal.emoji}</span>
      <span class="rank-name">${escapeHtml(p.nickname)}</span>
      <span class="rank-correct">정답 ${p.correctCount}개</span>
      <span class="rank-status">${p.eliminated ? '탈락' : '생존 중'}</span>`;
    container.appendChild(row);
  });
}
function toWaitingRoom() {
  stopLoop(); resetPauseState();
  G.gameState = 'waiting';
  Object.values(G.players).forEach(p => { p.row = START_ROW; p.wrongCount = 0; p.correctCount = 0; p.eliminated = false; p.eliminatedAt = null; p.plan = null; });
  renderWaitingRoom();
  showScreen('waiting');
}
$('btn-restart').addEventListener('click', () => { ensureAudio(); startGame(); });
$('btn-result-to-waiting').addEventListener('click', toWaitingRoom);
// 나가기: 게임을 멈추고 화면 안 확인 창을 띄움 (iframe 안에서도 동작)
let exitPaused = false;
function closeExitDialog() {
  $('exit-overlay').classList.add('hidden');
  if (exitPaused) { exitPaused = false; rankPaused = false; syncPause(); }
}
$('btn-give-up').addEventListener('click', () => {
  if (!G) return;
  if (G.gameState !== 'waiting' && G.gameState !== 'ended' && !paused) { exitPaused = true; rankPaused = true; syncPause(); }
  $('exit-overlay').classList.remove('hidden');
});
$('btn-exit-cancel').addEventListener('click', closeExitDialog);
$('btn-exit-waiting').addEventListener('click', () => { exitPaused = false; $('exit-overlay').classList.add('hidden'); toWaitingRoom(); });
$('btn-exit-home').addEventListener('click', () => {
  exitPaused = false; $('exit-overlay').classList.add('hidden');
  toWaitingRoom();
  $('btn-back-to-login').click();
});

// ---------- 순위 보기 (열려 있는 동안 게임 멈춤) ----------
$('btn-ranking-toggle').addEventListener('click', () => {
  if (!G || G.gameState === 'waiting' || G.gameState === 'ended') return;
  renderRankingInto($('ranking-list'), computeRanking());
  rankPaused = true; syncPause();
  rankingOverlay.classList.remove('hidden');
});
$('btn-ranking-close').addEventListener('click', () => {
  rankPaused = false; syncPause();
  rankingOverlay.classList.add('hidden');
});

// ---------- ESC 일시정지 ----------
function setEscPause(on) {
  escPaused = on; syncPause();
  pauseOverlay.classList.toggle('hidden', !on);
}
window.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!screens.game.classList.contains('active') || !G) return;
  e.preventDefault();
  if (rankPaused) { $('btn-ranking-close').click(); return; }
  setEscPause(!escPaused);
});
$('btn-resume').addEventListener('click', () => { setEscPause(false); if (!answerInput.disabled) answerInput.focus(); });
$('btn-restart-mid').addEventListener('click', toWaitingRoom);

</script>
