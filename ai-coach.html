<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀 토론 [주장-이유-근거] 빌더</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">
    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-slate-100">
        <!-- 헤더 -->
        <div class="border-b pb-4 mb-6">
            <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">Debate Practice Tool</span>
            <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 mt-2">팀 토론 [주장 - 이유 - 근거] 대본 빌더</h1>
            <p class="text-sm text-slate-500 mt-1">3:3 팀 토론 역할(토론자/사회자)에 맞춰 논리적인 발언 대본을 완성해 보세요.</p>
        </div>

        <form id="debateForm" class="space-y-6">
            <!-- 1. 주제 선택 -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">토론 주제</label>
                <select id="topicSelect" onchange="toggleCustomTopic()" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none mb-2">
                    <option value="학생들의 과제 수행 시 AI 사용을 허용해야 한다">학생들의 과제 수행 시 AI 사용을 허용해야 한다</option>
                    <option value="자율 주행차의 도로 운행을 전면 허용해야 한다">자율 주행차의 도로 운행을 전면 허용해야 한다</option>
                    <option value="온라인 수업이 대면 수업보다 낫다">온라인 수업이 대면 수업보다 낫다</option>
                    <option value="custom">✏️ 직접 입력하기</option>
                </select>
                <input type="text" id="customTopic" placeholder="토론 주제를 직접 입력하세요"
                    class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none hidden">
            </div>

            <!-- 2. 역할 선택 -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">나의 역할</label>
                <select id="role" onchange="toggleRoleFields()" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <optgroup label="토론자 (Speaker)">
                        <option value="찬성 1번 (입론 & 1,2번 논거)">찬성 1번 (입론 & 1,2번 논거)</option>
                        <option value="반대 1번 (반박 & 1,2번 논거)">반대 1번 (반박 & 1,2번 논거)</option>
                        <option value="찬성 2번 (심화 & 3번 논거)">찬성 2번 (심화 & 3번 논거)</option>
                        <option value="반대 2번 (심화 & 3번 논거)">반대 2번 (심화 & 3번 논거)</option>
                        <option value="찬성 3번 (종합 반박 & 요약)">찬성 3번 (종합 반박 & 요약)</option>
                        <option value="반대 3번 (종합 반박 & 요약)">반대 3번 (종합 반박 & 요약)</option>
                    </optgroup>
                    <optgroup label="사회자 (Moderator)">
                        <option value="사회자 - 오프닝">사회자 - 오프닝 (토론 시작 안내)</option>
                        <option value="사회자 - 찬성 발언 직후 진행">사회자 - 찬성 발언 직후 진행</option>
                        <option value="사회자 - 반대 발언 직후 진행">사회자 - 반대 발언 직후 진행</option>
                        <option value="사회자 - 클로징">사회자 - 클로징 (토론 마무리 안내)</option>
                    </optgroup>
                </select>
            </div>

            <!-- 3-A. 토론자용: 주장-이유-근거 -->
            <div id="speakerFields" class="space-y-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                <div>
                    <label class="block text-sm font-bold text-indigo-900 mb-1">
                        1. 주장 (Assertion) <span class="text-xs font-normal text-indigo-600">- 한 문장으로 명확하게</span>
                    </label>
                    <input type="text" id="assertion" placeholder="예: 저희 팀은 학생들의 과제 수행 시 AI 사용을 허용해야 한다고 생각합니다."
                        class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-emerald-900 mb-1">
                        2. 이유 (Reasoning) <span class="text-xs font-normal text-emerald-600">- 왜 그렇게 생각하는지 핵심 이유</span>
                    </label>
                    <textarea id="reasoning" rows="2" placeholder="예: 왜냐하면 AI는 학생들의 자료 조사 시간을 줄여주고 비판적 사고에 더 집중할 수 있게 돕는 도구이기 때문입니다."
                        class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-bold text-amber-900 mb-1">
                        3. 근거 (Evidence) <span class="text-xs font-normal text-amber-600">- 통계, 연구 결과, 객관적 사례</span>
                    </label>
                    <textarea id="evidence" rows="3" placeholder="예: 실제로 2024년 교육 연구 결과에 따르면, AI를 조사 도구로 활용한 집단이 정보 분석 및 정리 능력에서 20% 높은 성취도를 보였습니다."
                        class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none"></textarea>
                </div>
            </div>

            <!-- 3-B. 사회자용: 진행 멘트 -->
            <div id="moderatorFields" class="space-y-4 bg-sky-50 p-4 rounded-xl border border-sky-200 hidden">
                <div>
                    <label class="block text-sm font-bold text-sky-900 mb-1">
                        핵심 진행 메모 <span class="text-xs font-normal text-sky-600">- 다음 순서를 안내하며 강조하고 싶은 포인트</span>
                    </label>
                    <textarea id="moderatorNote" rows="3" placeholder="예: 방금 찬성 측의 논거를 정리하고, 이어서 반대 측의 반박을 요청합니다."
                        class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none"></textarea>
                </div>
            </div>

            <button type="button" onclick="generateScript()"
                class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg transition duration-200 shadow-md">
                발언 대본 생성하기
            </button>
        </form>

        <div id="outputArea" class="mt-8 hidden space-y-4 border-t pt-6">
            <h2 class="text-xl font-bold text-slate-900">완성된 발언 대본</h2>
            <div id="scriptBox" class="bg-indigo-50 border border-indigo-200 p-4 rounded-xl text-slate-800 whitespace-pre-line font-mono text-sm"></div>

            <div class="bg-amber-50 border border-amber-200 p-4 rounded-xl">
                <h3 class="font-bold text-amber-900 text-sm mb-2">💡 자가 논리 점검 체크리스트</h3>
                <ul class="text-xs text-amber-800 space-y-1 list-disc list-inside">
                    <li>주장이 명확한 한 문장으로 제시되었는가?</li>
                    <li>이유가 주장을 논리적으로 받쳐주고 있는가? ('왜냐하면~')</li>
                    <li>근거에 출처, 통계, 사례 등 객관적 사실이 포함되어 있는가?</li>
                </ul>
            </div>

            <!-- ===== [추가] AI 보완·피드백 ===== -->
            <button type="button" id="aiFbBtn" onclick="getAIFeedback()"
                class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 disabled:bg-emerald-300 disabled:cursor-not-allowed text-white font-bold rounded-lg transition duration-200 shadow-md">
                🤖 AI 보완 · 피드백 받기
            </button>
            <div id="aiFbArea" class="hidden space-y-4"></div>
        </div>
    </div>

    <script>
        function toggleCustomTopic() {
            const select = document.getElementById('topicSelect');
            document.getElementById('customTopic').classList.toggle('hidden', select.value !== 'custom');
        }

        function toggleRoleFields() {
            const isModerator = document.getElementById('role').value.startsWith('사회자');
            document.getElementById('speakerFields').classList.toggle('hidden', isModerator);
            document.getElementById('moderatorFields').classList.toggle('hidden', !isModerator);
        }

        function getTopic() {
            const select = document.getElementById('topicSelect');
            return select.value === 'custom' ? document.getElementById('customTopic').value : select.value;
        }

        function generateScript() {
            const topic = getTopic();
            const role = document.getElementById('role').value;
            let script = '';

            if (!topic) { alert('토론 주제를 입력해 주세요!'); return; }

            if (role.startsWith('사회자')) {
                const note = document.getElementById('moderatorNote').value;
                if (!note) { alert('진행 메모를 입력해 주세요!'); return; }

                const templates = {
                    '사회자 - 오프닝': `안녕하십니까. 지금부터 '${topic}'를 주제로 한 토론을 시작하겠습니다.
오늘 토론은 찬성 측과 반대 측이 각각 1, 2, 3번 토론자로 참여하며, 입론-반박-요약 순으로 진행됩니다.

[진행 메모]
${note}

그럼 먼저 찬성 측 1번 토론자부터 입론을 시작해 주시기 바랍니다.`,
                    '사회자 - 찬성 발언 직후 진행': `네, 찬성 측의 발언 잘 들었습니다.

[진행 메모 - 발언 요약 및 다음 순서 안내]
${note}

이어서 반대 측의 반박을 들어보겠습니다. 반대 측 토론자, 발언해 주시기 바랍니다.`,
                    '사회자 - 반대 발언 직후 진행': `네, 반대 측의 발언 잘 들었습니다.

[진행 메모 - 발언 요약 및 다음 순서 안내]
${note}

이어서 찬성 측의 반박을 들어보겠습니다. 찬성 측 토론자, 발언해 주시기 바랍니다.`,
                    '사회자 - 클로징': `양측의 열띤 토론 잘 들었습니다. 이것으로 '${topic}'에 대한 토론을 마치겠습니다.

[진행 메모 - 토론 총평]
${note}

오늘 토론에 참여해 주신 모든 토론자 여러분께 감사드립니다. 이것으로 토론을 마치겠습니다.`
                };
                script = `[${role} 진행 대본]\n\n${templates[role]}`;
            } else {
                const assertion = document.getElementById('assertion').value;
                const reasoning = document.getElementById('reasoning').value;
                const evidence = document.getElementById('evidence').value;
                if (!assertion || !reasoning || !evidence) { alert('모든 항목을 입력해 주세요!'); return; }

                script = `[${role} 발언 대본]

안녕하십니까. 오늘 '${topic}'에 대해 발언을 맡은 ${role}입니다.

[주장]
${assertion}

[이유]
${reasoning}

[근거]
${evidence}

[마무리]
따라서 이러한 이유와 객관적 근거를 바탕으로 저희 팀의 입장을 강력히 주창합니다. 감사합니다.`;
            }

            document.getElementById('scriptBox').innerText = script;
            document.getElementById('outputArea').classList.remove('hidden');
        }
    </script>
    <!-- ===== [추가] AI 보완·피드백 스크립트 ===== -->
    <script>
        // ▼▼▼ 여기에 Gemini API 키를 붙여 넣으세요 (AI Studio에서 발급) ▼▼▼
        const GEMINI_API_KEY = 'AQ.Ab8RN6JF6AKwcTyzZIAtgei17i_p8zG9y40HneBOACuGJQv-Zw';
        const GEMINI_MODEL = 'gemini-3.8-flash';
        const GEMINI_FALLBACK_MODEL = 'gemini-flash-lite-latest'; // 서버가 붐빌 때 대신 쓸 모델
        // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

        // 새 대본을 만들면 이전 피드백 숨기기 (기존 함수는 그대로 두고 감싸기만 함)
        const _originalGenerateScript = generateScript;
        generateScript = function () {
            _originalGenerateScript();
            const area = document.getElementById('aiFbArea');
            area.classList.add('hidden'); area.innerHTML = '';
        };

        const escHTML = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        let useThinkingLow = true; // 추론을 낮게 → 더 빠름 (지원 안 하면 자동으로 끔)
        async function geminiOnce(model, system, prompt, json = true) {
            const generationConfig = json ? { responseMimeType: 'application/json', temperature: 0.6 } : { temperature: 0.7 };
            if (useThinkingLow) generationConfig.thinkingConfig = { thinkingLevel: 'low' };
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(GEMINI_API_KEY)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    systemInstruction: { parts: [{ text: system }] },
                    contents: [{ role: 'user', parts: [{ text: prompt }] }],
                    generationConfig
                })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                if (res.status === 400 && useThinkingLow && /thinking/i.test(data.error?.message || '')) {
                    useThinkingLow = false;
                    return geminiOnce(model, system, prompt, json);
                }
                const err = new Error(data.error?.message || ('오류 (' + res.status + ')'));
                err.busy = [429, 500, 503].includes(res.status) || /high demand|overloaded|try again later|unavailable/i.test(err.message);
                throw err;
            }
            const text = data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
            if (!text) throw new Error('AI 응답이 비어 있어요. 다시 시도해 주세요.');
            return text;
        }

        // 서버가 붐비면 기다리지 않고 바로 가벼운 모델로 → 그래도 안 되면 짧게 쉬며 번갈아 시도
        async function callGemini(system, prompt, onStatus, json = true) {
            const plan = [
                [GEMINI_MODEL, 0, ''],
                [GEMINI_FALLBACK_MODEL, 0, '서버가 붐벼서 가벼운 모델로 바로 전환했어요'],
                [GEMINI_MODEL, 2000, '다시 시도하는 중 (1/2)'],
                [GEMINI_FALLBACK_MODEL, 3000, '다시 시도하는 중 (2/2)']
            ];
            for (const [model, wait, msg] of plan) {
                if (msg) onStatus(msg);
                if (wait) await sleep(wait);
                try { return await geminiOnce(model, system, prompt, json); }
                catch (e) { if (!e.busy) throw e; }
            }
            throw new Error('구글 서버가 지금 많이 붐벼요. 1~2분 뒤 다시 눌러 주세요.');
        }

        function parseJSON(text) {
            const t = text.trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
            try { return JSON.parse(t); } catch {}
            const a = t.indexOf('{'), b = t.lastIndexOf('}');
            if (a >= 0 && b > a) return JSON.parse(t.slice(a, b + 1));
            throw new Error('AI 응답을 해석하지 못했어요. 다시 시도해 주세요.');
        }

        let lastFb = null;
        async function getAIFeedback() {
            const area = document.getElementById('aiFbArea');
            const btn = document.getElementById('aiFbBtn');
            const script = document.getElementById('scriptBox').innerText.trim();
            const role = document.getElementById('role').value;
            const topic = getTopic();
            const isModerator = role.startsWith('사회자');

            area.classList.remove('hidden');
            if (!GEMINI_API_KEY) {
                area.innerHTML = `<div class="bg-rose-50 border border-rose-200 text-rose-700 p-4 rounded-xl text-sm">API 키가 없어요. HTML 코드에서 <code class="font-mono bg-white px-1 rounded">GEMINI_API_KEY</code> 줄에 키를 넣어 주세요.</div>`;
                return;
            }
            if (!script) return;

            const criteria = isModerator
                ? ['진행 안내의 명확성', '중립성', '발언 요약의 정확성', '순서·시간 안내', '전달력']
                : ['주장의 명확성', '이유의 논리성', '근거의 객관성', '역할 수행', '전달력'];

            const system = '당신은 고등학생 토론 수업을 지도하는 토론 코치입니다. 학생 눈높이에 맞춰 친절하지만 구체적으로 피드백합니다. 근거가 지어낸 것처럼 보이거나 출처가 불분명하면 반드시 지적하고, 학생이 직접 확인할 수 있는 자료 종류를 안내합니다. 존재가 확실하지 않은 통계나 연구를 새로 지어내지 말고, 필요하면 [출처 확인 필요] 또는 [ ]로 빈칸을 남깁니다. 반드시 JSON만 출력합니다.';
            const prompt = `토론 주제: ${topic}
역할: ${role}
평가 기준(각 20점, 합계 100점): ${criteria.join(', ')}

아래 ${isModerator ? '사회자 진행 대본' : '토론 발언 대본'}을 평가하고 보완해 주세요.

출력 JSON 형식:
{
  "total": 0~100 정수,
  "criteria": [${criteria.map(c => `{"name":"${c}","score":0~20 정수,"comment":"한 줄 평"}`).join(',')}],
  "summary": "총평 2~3문장",
  "strengths": ["잘한 점", ...] (2~3개),
  "improvements": [{"title":"짧은 제목","reason":"왜 고쳐야 하는지","original":"원문 일부","revised":"고친 문장"}] (2~5개, 중요한 순)
}

--- 대본 시작 ---
${script}
--- 대본 끝 ---`;

            lastFb = { system, script, topic, role };
            btn.disabled = true;
            area.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm"><div class="w-8 h-8 border-4 border-emerald-100 border-t-emerald-600 rounded-full animate-spin mx-auto mb-3"></div>AI가 대본을 분석하는 중…<div id="aiFbStatus" class="text-xs text-slate-400 mt-1">보통 10~30초 걸려요</div></div>`;
            const setStatus = t => { const s = document.getElementById('aiFbStatus'); if (s) s.textContent = t; };

            try {
                const d = parseJSON(await callGemini(system, prompt, setStatus));
                lastFb.feedback = d;
                renderAIFeedback(d);
            } catch (e) {
                area.innerHTML = `<div class="bg-rose-50 border border-rose-200 text-rose-700 p-4 rounded-xl text-sm"><b>피드백 실패:</b> ${escHTML(e.message)}</div>`;
            } finally {
                btn.disabled = false;
            }
        }

        function renderAIFeedback(d) {
            const area = document.getElementById('aiFbArea');
            const crit = Array.isArray(d.criteria) ? d.criteria : [];
            const total = Number.isFinite(+d.total) ? Math.round(+d.total) : crit.reduce((a, c) => a + (+c.score || 0), 0);
            const color = p => p >= 80 ? 'bg-emerald-500' : p >= 60 ? 'bg-indigo-500' : p >= 40 ? 'bg-amber-500' : 'bg-rose-500';

            let h = `
            <div class="bg-white border border-slate-200 rounded-xl p-5">
                <div class="flex items-center gap-4 mb-4">
                    <div class="text-4xl font-extrabold text-slate-900">${total}<span class="text-base font-medium text-slate-400"> / 100</span></div>
                    <p class="text-sm text-slate-600 flex-1">${escHTML(d.summary || '')}</p>
                </div>
                <div class="space-y-3">
                    ${crit.map(c => {
                        const s = Math.max(0, Math.min(20, +c.score || 0));
                        return `<div>
                            <div class="flex justify-between text-sm font-semibold text-slate-700"><span>${escHTML(c.name)}</span><span class="font-mono text-slate-400">${s}/20</span></div>
                            <div class="h-2 bg-slate-100 rounded-full overflow-hidden mt-1"><div class="h-full ${color(s * 5)} rounded-full" style="width:${s * 5}%"></div></div>
                            ${c.comment ? `<p class="text-xs text-slate-500 mt-1">${escHTML(c.comment)}</p>` : ''}
                        </div>`;
                    }).join('')}
                </div>
            </div>`;

            if (Array.isArray(d.strengths) && d.strengths.length) {
                h += `<div class="bg-emerald-50 border border-emerald-200 p-4 rounded-xl">
                    <h3 class="font-bold text-emerald-900 text-sm mb-2">👍 잘한 점</h3>
                    <ul class="text-sm text-emerald-800 space-y-1 list-disc list-inside">${d.strengths.map(s => `<li>${escHTML(s)}</li>`).join('')}</ul>
                </div>`;
            }

            if (Array.isArray(d.improvements) && d.improvements.length) {
                h += `<div class="space-y-3"><h3 class="font-bold text-slate-900 text-sm">🛠 보완할 점</h3>
                    ${d.improvements.map((m, i) => `
                    <div class="border border-slate-200 rounded-xl p-4">
                        <div class="font-bold text-sm text-slate-900 mb-1">${i + 1}. ${escHTML(m.title || '')}</div>
                        ${m.reason ? `<p class="text-sm text-slate-600 mb-2">${escHTML(m.reason)}</p>` : ''}
                        ${m.original ? `<div class="text-sm bg-rose-50 text-rose-800 line-through decoration-rose-300 p-2 rounded-lg mb-1 whitespace-pre-line">${escHTML(m.original)}</div>` : ''}
                        ${m.revised ? `<div class="text-sm bg-emerald-50 text-emerald-800 p-2 rounded-lg whitespace-pre-line">${escHTML(m.revised)}</div>` : ''}
                    </div>`).join('')}
                </div>`;
            }

            h += `<div id="revisedWrap">
                <button type="button" id="revisedBtn" onclick="getRevisedScript()"
                    class="w-full py-3 bg-white border-2 border-emerald-500 text-emerald-700 hover:bg-emerald-50 disabled:opacity-50 font-bold rounded-lg transition">
                    ✨ 보완한 대본 받기
                </button>
            </div>`;

            area.innerHTML = h;
        }

        async function getRevisedScript() {
            if (!lastFb) return;
            const wrap = document.getElementById('revisedWrap');
            const btn = document.getElementById('revisedBtn');
            btn.disabled = true;
            btn.innerHTML = '대본을 다듬는 중… <span id="revStatus" class="text-xs font-normal"></span>';
            const setStatus = t => { const s = document.getElementById('revStatus'); if (s) s.textContent = '· ' + t; };
            const imp = (lastFb.feedback?.improvements || []).map((m, i) => `${i + 1}. ${m.title}: ${m.reason || ''}${m.revised ? ' → ' + m.revised : ''}`).join('\n');
            const prompt = `토론 주제: ${lastFb.topic}\n역할: ${lastFb.role}\n\n아래 보완점을 모두 반영해 대본 전체를 다시 써 주세요. 원래 구성([주장]/[이유]/[근거]/[마무리] 같은 머리표)은 유지하고, 설명이나 머리말 없이 대본만 출력하세요. 확실하지 않은 통계·연구는 지어내지 말고 [출처 확인 필요]로 남기세요.\n\n[보완점]\n${imp}\n\n--- 원래 대본 ---\n${lastFb.script}`;
            try {
                let text = await callGemini(lastFb.system.replace('반드시 JSON만 출력합니다.', '대본 본문만 출력합니다.'), prompt, setStatus, false);
                text = text.replace(/^```[a-z]*\n?/i, '').replace(/\n?```\s*$/, '').trim();
                wrap.innerHTML = `<div class="flex items-center justify-between mb-2">
                        <h3 class="font-bold text-slate-900 text-sm">✨ AI가 보완한 대본</h3>
                        <div class="flex gap-2">
                            <button type="button" onclick="copyRevised()" class="text-xs font-semibold px-3 py-1.5 border border-slate-200 rounded-lg hover:bg-slate-50">복사</button>
                            <button type="button" onclick="useRevised()" class="text-xs font-semibold px-3 py-1.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">위 대본에 반영</button>
                        </div>
                    </div>
                    <div id="revisedBox" class="bg-white border border-emerald-200 p-4 rounded-xl text-slate-800 whitespace-pre-line font-mono text-sm">${escHTML(text)}</div>`;
            } catch (e) {
                btn.disabled = false;
                btn.textContent = '✨ 보완한 대본 받기 (다시 시도)';
                alert('보완 대본 실패: ' + e.message);
            }
        }

        function copyRevised() {
            const t = document.getElementById('revisedBox').innerText;
            navigator.clipboard.writeText(t).then(() => alert('복사했어요!'), () => alert('복사에 실패했어요. 직접 드래그해서 복사해 주세요.'));
        }
        function useRevised() {
            document.getElementById('scriptBox').innerText = document.getElementById('revisedBox').innerText;
            document.getElementById('scriptBox').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    </script>
</body>
</html>
