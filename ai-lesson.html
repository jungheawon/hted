<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 수업 설계 · HTRO EDU</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 왼쪽 대화형 입력 패널(sticky) + 오른쪽 50분 타임라인과 5단계 수업안 */
:root{
  --bg:#FAFAFB; --surface:#FFFFFF; --sunk:#F1F2F7; --line:#E3E5EE;
  --fg:#15172A; --muted:#62667E; --faint:#9A9DB2;
  --accent:#3654F4; --accent-soft:#E8ECFF; --accent-ink:#FFFFFF;
  --c-intro:#F2A33A; --c-practice:#3654F4; --c-assess:#12A07A; --c-close:#8B5CF6;
  --warn:#B4541A;
  --sans:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1180px;margin:0 auto;padding-block:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600}
.brand small{font-weight:500;color:var(--muted);font-size:13px}
.top .tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}

.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:880px){.shell{grid-template-columns:minmax(0,1fr)}}

/* 대화 패널 */
.chat{position:sticky;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-width:0}
@media (max-width:880px){.chat{position:static}}
.chat-log{padding:18px;display:flex;flex-direction:column;gap:14px}
.who{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.bubble-user{align-self:flex-end;max-width:92%;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:14px 14px 4px 14px;font-size:14.5px;white-space:pre-wrap;word-break:keep-all}
.msg-ai{display:flex;flex-direction:column;gap:8px}
.msg-ai p{margin:0;font-size:14.5px}
.toc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.toc a{display:flex;align-items:center;gap:12px;padding:10px 12px;color:var(--fg);text-decoration:none;font-weight:500;font-size:14.5px;border-top:1px solid var(--line)}
.toc li:first-child a{border-top:0}
.toc a:hover{background:var(--sunk)}
.toc .n{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600;width:20px}
.toc .m{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.thinking{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:b 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.err{color:var(--warn);font-size:14px}

.composer{border-top:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px}
.composer label{font-size:12.5px;font-weight:700;color:var(--muted)}
.composer textarea{width:100%;min-height:92px;resize:vertical;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:10px 12px;font:inherit;font-size:14.5px;line-height:1.55}
.composer textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:12.5px}
.chip:hover{color:var(--fg);border-color:var(--faint)}
.row{display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14.5px}
.btn-primary{background:var(--accent);color:var(--accent-ink);flex:1}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:var(--sunk);color:var(--fg)}
.note{font-size:12.5px;color:var(--muted);margin:0}

/* 결과 */
.plan{min-width:0;display:flex;flex-direction:column;gap:22px}
.plan-head{display:flex;flex-direction:column;gap:10px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta span{font-size:12.5px;font-weight:500;background:var(--sunk);color:var(--muted);padding:3px 10px;border-radius:6px}
.plan-head h1{font-size:clamp(24px,3.2vw,32px);font-weight:800;letter-spacing:-.025em}
.plan-head .sum{color:var(--muted);margin:0;max-width:62ch}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.sample-flag{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:6px;align-self:flex-start}

/* 50분 타임라인 */
.timeline{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px 12px}
.tl-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.tl-label b{color:var(--fg);font-family:var(--mono);font-weight:600}
.bar{display:flex;height:34px;border-radius:8px;overflow:hidden;gap:2px}
.seg{display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-decoration:none;min-width:0}
.seg:hover{filter:brightness(1.08)}
.ticks{position:relative;height:18px;margin-top:4px;font-family:var(--mono);font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;transform:translateX(-50%)}
.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}

/* 섹션 */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;scroll-margin-top:16px;display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h .n{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--sc,var(--accent))}
.sec-h h2{font-size:19px;font-weight:800;letter-spacing:-.015em}
.sec-h .min{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--sc,var(--muted));font-variant-numeric:tabular-nums;border:1px solid currentColor;border-radius:6px;padding:1px 8px}
.goals{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:g}
.goals li{display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:baseline}
.goals li::before{counter-increment:g;content:counter(g);font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;text-align:center;line-height:22px;height:22px}
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:52px 1fr;gap:14px;padding:12px 0;border-top:1px dashed var(--line)}
.step:first-child{border-top:0;padding-top:0}
.step .t{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.step h3{font-size:15.5px;font-weight:700;margin-bottom:2px}
.step p{margin:0;color:var(--muted);font-size:14.5px}
.step .tool{display:inline-block;margin-top:6px;font-size:12px;font-weight:500;color:var(--fg);background:var(--sunk);border-radius:6px;padding:2px 8px}
.tip{background:var(--sunk);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--muted)}
.tip b{color:var(--fg)}
.qs{display:flex;flex-direction:column;gap:10px;counter-reset:q}
.q{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.q-top{display:flex;gap:8px;align-items:baseline}
.q-top::before{counter-increment:q;content:"Q" counter(q);font-family:var(--mono);font-size:12px;font-weight:600;color:var(--c-assess)}
.q-type{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
.q p{margin:0;font-weight:500}
.q details{margin-top:6px;font-size:14px;color:var(--muted)}
.q summary{cursor:pointer;color:var(--c-assess);font-size:13px;font-weight:700}
.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.mats{display:flex;flex-wrap:wrap;gap:6px}
.mats span{font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted)}
.sub{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.empty-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.empty-list li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:var(--sunk);color:var(--muted);font-weight:500}
.empty-list .n{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13.5px;font-weight:500}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}html{scroll-behavior:auto}}
html{scroll-behavior:smooth}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600}
.icon-btn:hover{color:var(--fg);border-color:var(--faint)}
.settings{max-width:1180px;margin:0 auto 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.settings h2{font-size:15px;font-weight:800}
.settings .grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px}
@media (max-width:640px){.settings .grid{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.field input{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:9px 11px;font:inherit;font-size:14px;font-family:var(--mono)}
.field input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.key-state{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.key-state.on{background:#E3F6EF;color:#0B7A5C}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="mark">H</span>HTRO EDU <small>AI 수업 설계</small></div>
  <span class="tag">Lesson Designer</span>
</header>


<main class="shell">
  <aside class="chat" aria-label="AI 수업 설계 대화">
    <div class="chat-log" id="log"></div>
    <form class="composer" id="form">
      <label for="prompt">어떤 수업을 준비할까요?</label>
      <textarea id="prompt" name="prompt" placeholder="예: 고등학교 1학년 정보 데이터 단원 50분 수업을 준비해줘."></textarea>
      <div class="chips" id="chips">
        <button type="button" class="chip">고1 국어 비평하며 읽기 50분, 토론 중심</button>
        <button type="button" class="chip">고1 영어 관계대명사 50분, 짝 활동</button>
        <button type="button" class="chip">고1 수학 이차함수의 최대·최소 50분</button>
        <button type="button" class="chip">고1 통합사회 인권 보장 50분, 사례 탐구</button>
        <button type="button" class="chip">고1 통합과학 산화와 환원 50분, 실험</button>
      </div>
      <div class="row">
        <button type="submit" class="btn btn-primary" id="go">수업 설계하기</button>
        <button type="button" class="btn btn-ghost" id="stop" hidden>중지</button>
      </div>
      <p class="note" id="avail">학년·과목·단원·수업 시간을 적으면 더 정확해요.</p>
    </form>
  </aside>

  <section class="plan" id="plan" aria-live="polite"></section>
</main>
<div class="toast" id="toast" hidden></div>

<script>
/* ================================================================
   ★ 설정 — 여기만 바꾸면 돼요 ★
   1) Google AI Studio(aistudio.google.com/apikey)에서 만든 키를
      아래 따옴표 안에 붙여 넣으세요.
   2) 이 키는 페이지 소스에서 누구나 볼 수 있어요.
      Cloud Console에서 꼭 '웹사이트 제한'(hted.kr)을 걸어 두세요.
   ================================================================ */
const GEMINI_KEY = "여기에_API_키를_붙여넣으세요";

// 위에서부터 차례로 시도해요. 무료 한도가 넉넉한 Flash-Lite가 먼저예요.
const GEMINI_MODELS = ["gemini-flash-lite-latest", "gemini-flash-latest"];
/* ================================================================ */


const SECTIONS = [
  {key:"goals", n:"01", name:"학습 목표"},
  {key:"intro", n:"02", name:"수업 도입", color:"var(--c-intro)"},
  {key:"practice", n:"03", name:"실습 활동", color:"var(--c-practice)"},
  {key:"assessment", n:"04", name:"형성평가", color:"var(--c-assess)"},
  {key:"closing", n:"05", name:"마무리", color:"var(--c-close)"}
];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let current = null, isSample = false, ctl = null, sampleFn = null;

function minutesOf(p, k){ return k === "goals" ? null : Number(p[k]?.minutes) || 0; }

function renderPlan(p){
  const total = Number(p.duration) || ["intro","practice","assessment","closing"].reduce((a,k)=>a+minutesOf(p,k),0);
  const segs = SECTIONS.filter(s=>s.key!=="goals").map(s=>{
    const m = minutesOf(p,s.key);
    return `<a class="seg" href="#s-${s.key}" style="flex:${m};background:${s.color}" title="${s.name} ${m}분">${s.name} ${m}′</a>`;
  }).join("");
  const ticks = [];
  for(let t=0;t<=total;t+=10) ticks.push(t);
  if(ticks[ticks.length-1]!==total) ticks.push(total);
  const tickHtml = ticks.map(t=>`<span style="left:${t/total*100}%">${t}</span>`).join("");

  const stepList = (steps, startAt) => {
    let t = startAt;
    return `<div class="steps">${(steps||[]).map(st=>{
      const from = t; t += Number(st.minutes)||0;
      return `<div class="step"><div class="t">${from}–${t}′</div><div><h3>${esc(st.title)}</h3><p>${esc(st.detail)}</p>${st.tool?`<span class="tool">${esc(st.tool)}</span>`:""}</div></div>`;
    }).join("")}</div>`;
  };
  const introStart = 0, pracStart = minutesOf(p,"intro");
  const asStart = pracStart + minutesOf(p,"practice");
  const clStart = asStart + minutesOf(p,"assessment");

  const head = (s, m) => `<div class="sec-h" style="--sc:${s.color||"var(--accent)"}"><span class="n">${s.n}</span><h2>${s.name}</h2>${m!=null?`<span class="min">${m}분</span>`:""}</div>`;

  const body = {
    goals: `<ol class="goals">${(p.goals||[]).map(g=>`<li><span>${esc(g)}</span></li>`).join("")}</ol>`,
    intro: stepList(p.intro?.steps, introStart) + (p.intro?.tip?`<div class="tip"><b>수업 팁</b> · ${esc(p.intro.tip)}</div>`:""),
    practice: stepList(p.practice?.steps, pracStart)
      + (p.practice?.materials?.length?`<div class="sub">준비물</div><div class="mats">${p.practice.materials.map(m=>`<span>${esc(m)}</span>`).join("")}</div>`:"")
      + (p.practice?.tip?`<div class="tip"><b>수업 팁</b> · ${esc(p.practice.tip)}</div>`:""),
    assessment: `<div class="qs">${(p.assessment?.questions||[]).map(q=>`<div class="q"><div class="q-top"><p>${esc(q.q)}</p><span class="q-type">${esc(q.type)}</span></div><details><summary>예시 답안</summary>${esc(q.answer)}</details></div>`).join("")}</div>`,
    closing: `<ul class="list">${(p.closing?.items||[]).map(i=>`<li>${esc(i)}</li>`).join("")}</ul>${p.closing?.next?`<div class="tip"><b>차시 예고</b> · ${esc(p.closing.next)}</div>`:""}`
  };

  $("#plan").innerHTML = `
    <div class="plan-head">
      ${isSample?'<span class="sample-flag">예시 수업안</span>':""}
      <div class="meta">${[p.grade,p.subject,p.unit,total+"분"].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("")}</div>
      <h1>${esc(p.title)}</h1>
      <p class="sum">${esc(p.summary)}</p>
      <div class="head-actions"><button class="btn btn-ghost" id="copy" type="button">수업안 텍스트 복사</button></div>
    </div>
    <div class="timeline">
      <div class="tl-label"><span>수업 흐름</span><span>총 <b>${total}</b>분</span></div>
      <div class="bar">${segs}</div>
      <div class="ticks">${tickHtml}</div>
    </div>
    ${SECTIONS.map(s=>`<article class="sec" id="s-${s.key}">${head(s, minutesOf(p,s.key))}${body[s.key]}</article>`).join("")}
  `;
  $("#copy").addEventListener("click", copyPlan);
}

function aiReply(p){
  return `<div class="msg-ai"><div class="who">AI</div><p>수업 목표와 활동을 구성했습니다.</p>
    <ul class="toc">${SECTIONS.map(s=>{const m=minutesOf(p,s.key);return `<li><a href="#s-${s.key}"><span class="n">${s.n}</span>${s.name}${m!=null?`<span class="m">${m}분</span>`:""}</a></li>`;}).join("")}</ul></div>`;
}
function userBubble(text){ return `<div style="display:flex;flex-direction:column;align-items:flex-end"><div class="who">입력</div><div class="bubble-user">${esc(text)}</div></div>`; }

function setLog(text, aiHtml){ $("#log").innerHTML = userBubble(text) + aiHtml; }

function planToText(p){
  const L = [];
  L.push(`[${p.title}]`, `${p.grade} · ${p.subject} · ${p.unit} · ${p.duration}분`, p.summary, "");
  L.push("01 학습 목표"); (p.goals||[]).forEach((g,i)=>L.push(`  ${i+1}. ${g}`)); L.push("");
  const steps = (k,label)=>{ L.push(`${label} (${p[k].minutes}분)`); (p[k].steps||[]).forEach(s=>L.push(`  - ${s.title} (${s.minutes}분): ${s.detail}${s.tool?` [${s.tool}]`:""}`)); if(p[k].tip) L.push(`  * 팁: ${p[k].tip}`); };
  steps("intro","02 수업 도입"); L.push("");
  steps("practice","03 실습 활동"); if(p.practice.materials?.length) L.push(`  준비물: ${p.practice.materials.join(", ")}`); L.push("");
  L.push(`04 형성평가 (${p.assessment.minutes}분)`); (p.assessment.questions||[]).forEach((q,i)=>L.push(`  Q${i+1}. [${q.type}] ${q.q}`, `      예시 답안: ${q.answer}`)); L.push("");
  L.push(`05 마무리 (${p.closing.minutes}분)`); (p.closing.items||[]).forEach(i=>L.push(`  - ${i}`)); if(p.closing.next) L.push(`  ${p.closing.next}`);
  return L.join("\n");
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,1800); }
async function copyPlan(){
  const text = planToText(current);
  try{ await navigator.clipboard.writeText(text); toast("수업안을 복사했어요"); }
  catch{ const ta=document.createElement("textarea"); ta.value=text; ta.style.cssText="position:fixed;opacity:0"; document.body.append(ta); ta.select(); try{document.execCommand("copy"); toast("수업안을 복사했어요");}catch{toast("복사하지 못했어요. 직접 선택해 복사해 주세요");} ta.remove(); }
}

const ERR = {
  not_granted:"이 페이지에서 Claude 사용이 허용되지 않았어요.",
  sampling_disabled:"이 계정에서는 AI 생성을 쓸 수 없어요.",
  rate_limited:"요청이 많아요. 잠시 후 다시 눌러 주세요.",
  session_expired:"다시 로그인한 뒤 시도해 주세요.",
  invalid_json:"수업안 형식이 어긋났어요. 다시 한 번 눌러 주세요.",
  refused:"이 요청으로는 수업안을 만들 수 없어요. 내용을 바꿔 주세요."
};

function normalize(p){
  if(!p || typeof p!=="object" || !Array.isArray(p.goals)) throw {code:"invalid_json"};
  for(const k of ["intro","practice","assessment","closing"]) p[k] = p[k] || {minutes:0};
  const sum = ["intro","practice","assessment","closing"].reduce((a,k)=>a+(Number(p[k].minutes)||0),0);
  p.duration = Number(p.duration) || sum;
  if(sum && sum !== p.duration) p.duration = sum;
  return p;
}

$("#chips").addEventListener("click", e=>{ const b=e.target.closest(".chip"); if(b){ $("#prompt").value=b.textContent; $("#prompt").focus(); }});
$("#stop").addEventListener("click", ()=>ctl?.abort());
$("#prompt").addEventListener("keydown", e=>{ if(e.key==="Enter" && (e.metaKey||e.ctrlKey)) $("#form").requestSubmit(); });

$("#form").addEventListener("submit", async e=>{
  e.preventDefault();
  const req = $("#prompt").value.trim();
  if(!req) return;
  ctl = new AbortController();
  $("#go").disabled = true; $("#stop").hidden = false;
  setLog(req, `<div class="msg-ai"><div class="who">AI</div><div class="thinking"><span class="dots"><i></i><i></i><i></i></span>수업을 설계하고 있어요…</div></div>`);
  try{
    const p = normalize(await callGemini(buildPrompt(req), ctl.signal));
    current = p; isSample = false;
    renderPlan(p); setLog(req, aiReply(p));
  }catch(err){
    const code = err?.code;
    if(code === "cancelled"){ setLog(req, `<div class="msg-ai"><div class="who">AI</div><p class="note">생성을 중지했어요.</p></div>`); }
    else{
      setLog(req, `<div class="msg-ai"><div class="who">AI</div><p class="err">${esc(ERR[code] || "잠시 연결이 끊겼어요. 다시 눌러 주세요.")}</p></div>`);
    }
  }finally{
    $("#go").disabled = false;
    $("#stop").hidden = true;
  }
});

// ── Gemini 연결 (키·모델 설정은 <script> 맨 위에 있어요) ──

function buildPrompt(req){
  return `당신은 한국 중·고등학교 수업 설계 전문가입니다. 교사의 요청에 맞춰 실제 교실에서 바로 쓸 수 있는 1차시 수업안을 만드세요.

교사 요청: """${req.slice(0,500)}"""

규칙:
- 한국어로 작성. 2022 개정 교육과정 수준에 맞추고, 요청에 학년·과목·단원·시간이 없으면 합리적으로 정한다(시간 기본 50분).
- intro, practice, assessment, closing의 minutes 합이 duration과 정확히 같아야 한다.
- 각 단계의 steps minutes 합은 그 단계 minutes와 같아야 한다.
- practice(실습 활동)는 학생이 직접 하는 핵심 활동이다. 과목에 맞게 구성한다(국어: 읽기·토론·글쓰기, 영어: 짝·모둠 말하기와 과제, 수학: 문제 해결·협력 풀이, 사회: 자료·사례 탐구, 과학: 실험·관찰·탐구, 정보: 실습). tool에는 교구·활동지·도구 이름을 쓰고 없으면 빈 문자열.
- 과학 실험이 들어가면 안전 수칙을 practice.tip에 적는다.
- 수학·과학 형성평가는 실제 풀 수 있는 구체적 문항(수치 포함)으로 쓴다.
- 형성평가는 3문항, 유형은 선택형/단답형/서술형 중에서.
- 문장은 짧고 교사가 바로 읽을 수 있게.

아래 형태의 JSON 하나만 답하세요:
{"title":"수업 제목(짧게)","summary":"한두 문장 요약","grade":"","subject":"","unit":"","duration":50,
"goals":["...","...","..."],
"intro":{"minutes":7,"steps":[{"title":"","minutes":3,"detail":""}],"tip":""},
"practice":{"minutes":28,"steps":[{"title":"","minutes":6,"detail":"","tool":""}],"materials":["..."],"tip":""},
"assessment":{"minutes":8,"questions":[{"q":"","type":"선택형","answer":""}]},
"closing":{"minutes":7,"items":["..."],"next":"다음 차시: ..."}}`;
}

ERR.auth = "AI 키가 맞지 않거나 이 주소에서 쓸 수 없게 막혀 있어요. 관리자에게 알려 주세요.";
ERR.no_key = "아직 AI 키가 들어 있지 않아요. 파일 안의 GEMINI_KEY에 키를 넣어 주세요.";
ERR.rate_limited = "지금 사용하는 선생님이 많아요. 1분쯤 뒤에 다시 눌러 주세요.";
ERR.overloaded = "AI 서버가 바빠요. 잠시 후 다시 눌러 주세요.";
ERR.network = "AI 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.";

function parseJSON(text){
  const tryParse = s => { try{ return JSON.parse(s); }catch{ return undefined; } };
  let v = tryParse(text.trim()); if(v!==undefined) return v;
  const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/); if(fence){ v = tryParse(fence[1]); if(v!==undefined) return v; }
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if(a>=0 && b>a){ v = tryParse(text.slice(a,b+1)); if(v!==undefined) return v; }
  throw {code:"invalid_json"};
}

// 앞 모델이 한도 초과(429)·이름 없음(404)·과부하(503)면 다음 모델로 넘어가요.
async function callGemini(prompt, signal){
  if(!GEMINI_KEY || GEMINI_KEY.includes("여기에")) throw {code:"no_key"};
  let lastErr = {code:"http"};
  for(const model of GEMINI_MODELS){
    try{ return await callGeminiModel(model, prompt, signal); }
    catch(err){
      lastErr = err;
      if(!["rate_limited","not_found","overloaded"].includes(err.code)) throw err;
    }
  }
  throw lastErr.code==="not_found" ? {code:"http"} : lastErr;
}

async function callGeminiModel(model, prompt, signal){
  let res;
  try{
    res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
      method:"POST", signal,
      headers:{ "Content-Type":"application/json", "X-goog-api-key": GEMINI_KEY },
      body: JSON.stringify({
        contents:[{ parts:[{ text: prompt }] }],
        generationConfig:{ responseMimeType:"application/json", temperature:0.7 }
      })
    });
  }catch(e){ throw {code: e?.name==="AbortError" ? "cancelled" : "network"}; }
  if(!res.ok){
    const s = res.status;
    throw {code: s===400||s===401||s===403 ? "auth" : s===404 ? "not_found" : s===429 ? "rate_limited" : s===503 ? "overloaded" : "http"};
  }
  const data = await res.json();
  const text = (data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
  if(!text) throw {code:"refused"};
  return parseJSON(text);
}
