<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HTRO 교실 투표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
/* Layout: 한 화면 앱. 상단 바(브랜드 + 단계) 아래 단일 작업 카드. 설정 → 투표 → 개표 */
:root{
  --bg:#FAFAFB; --surface:#FFFFFF; --line:#E6E8F0; --fg:#14161F; --muted:#6A6F82;
  --accent:#3654F4; --accent-ink:#FFFFFF; --accent-soft:#EEF1FE; --gold:#D9940B; --gold-soft:#FFF5DF; --danger:#D23B3B;
  --sans:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;
  -webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:20px 24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-family:var(--mono);font-size:13px}
.brand span{color:var(--muted);font-weight:500}
.steps{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;font-size:13px}
.steps b{padding:4px 12px;border-radius:999px;color:var(--muted);font-weight:500}
.steps b.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.steps b.done{color:var(--fg)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px}
@media (max-width:520px){.card{padding:20px 16px}}
h1{font-size:clamp(22px,4vw,30px);line-height:1.25;letter-spacing:-.02em;margin:0;text-wrap:balance;font-weight:800}
.sub{color:var(--muted);margin:6px 0 0}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:0 0 8px}

/* setup */
.setup{display:grid;gap:28px}
.field input[type=text]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.field input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.cands{display:grid;gap:8px}
.cand{display:flex;align-items:center;gap:8px}
.cand .no{width:40px;flex:none;text-align:center;font-family:var(--mono);font-weight:800;color:var(--accent);font-size:17px}
.cand input{flex:1;min-width:0}
.icon-btn{flex:none;width:40px;height:44px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--muted);font-size:20px;line-height:1}
.icon-btn:hover{color:var(--danger);border-color:var(--danger)}
.add{margin-top:4px;width:100%;padding:11px;border:1.5px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);font-weight:600}
.add:hover{border-color:var(--accent);color:var(--accent)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.stepper button{width:52px;height:52px;border:0;background:transparent;font-size:22px;font-weight:600}
.stepper button:hover{background:var(--accent-soft);color:var(--accent)}
.stepper input{width:84px;height:52px;border:0;border-inline:1px solid var(--line);text-align:center;font-family:var(--mono);font-weight:800;font-size:22px;background:var(--surface)}
.stepper input:focus{outline:none;background:var(--accent-soft)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.err{color:var(--danger);font-size:14px;font-weight:600;min-height:1.4em;margin:0}

.btn{border:0;border-radius:12px;padding:14px 22px;font-weight:700;background:var(--accent);color:var(--accent-ink);transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:none;transform:none}
.btn.big{padding:18px 28px;font-size:18px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--fg)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:10px}
.full{width:100%}

/* voting */
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.counter{text-align:right}
.counter .n{font-family:var(--mono);font-weight:800;font-size:clamp(34px,7vw,52px);line-height:1;letter-spacing:-.03em}
.counter .n em{font-style:normal;color:var(--muted);font-weight:500}
.counter small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:20px 0 24px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.turn{font-weight:700;font-size:15px;margin:0 0 12px}
.turn .mono{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.opt{position:relative;display:flex;align-items:center;gap:14px;text-align:left;padding:18px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);min-height:84px;transition:border-color .15s,background .15s,transform .1s}
.opt:hover{border-color:var(--accent)}
.opt:active{transform:scale(.985)}
.opt .k{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);font-weight:800;font-size:24px}
.opt .nm{font-weight:700;font-size:18px;min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink)}
.abst{margin-top:12px;width:100%;padding:14px;border:1.5px dashed var(--line);border-radius:var(--r);background:transparent;color:var(--muted);font-weight:700}
.abst:hover{border-color:var(--muted);color:var(--fg)}
.abst.sel{border-style:solid;border-color:var(--fg);color:var(--fg);background:var(--bg)}
.confirm{margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 14px 14px 18px;border-radius:var(--r);background:var(--bg);border:1px solid var(--line)}
.confirm p{margin:0;color:var(--muted)}
.confirm p b{color:var(--fg)}
.keys{font-size:12px;color:var(--muted);margin:14px 0 0}
.keys kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface)}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px;align-items:center}
.ask{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:600}

/* handoff */
.handoff{text-align:center;padding-block:40px}
.check{width:84px;height:84px;margin:0 auto 20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.check svg{width:40px;height:40px}
.handoff h1{margin-bottom:6px}
.handoff .btn{margin-top:28px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}

/* results */
.rhead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:24px}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:600}
.chip .mono{font-weight:800}
.board{display:grid;gap:8px}
.rk{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);position:relative;overflow:hidden}
.rk .pos{font-family:var(--mono);font-weight:800;font-size:22px;color:var(--muted)}
.rk .pos small{font-size:12px;font-weight:500}
.rk .who{min-width:0}
.rk .who b{display:block;font-size:17px;overflow-wrap:anywhere}
.rk .track{height:8px;border-radius:99px;background:var(--bg);margin-top:8px;overflow:hidden}
.rk .track i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.rk .cnt{font-family:var(--mono);font-weight:800;font-size:22px;text-align:right}
.rk .cnt small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
.rk.fin{opacity:.6}
.rk.tie{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);animation:flip .5s}
.crown.tie-lbl{color:var(--accent)}
.rk .num{color:var(--accent)}
.rk.hide .who b{color:transparent;background:var(--line);border-radius:6px;width:min(140px,60%);user-select:none}
.rk.hide .cnt{color:var(--line)}
.rk.next{border-color:var(--accent);border-style:dashed}
.rk.shown{animation:flip .55s cubic-bezier(.2,.9,.3,1.2)}
.rk.win{border:2px solid var(--gold);background:var(--gold-soft);padding-block:22px}
.rk.win .pos{color:var(--gold);font-size:28px}
.rk.win .who b{font-size:24px;font-weight:900}
.rk.win .track i{background:var(--gold)}
.rk.win .cnt{color:var(--gold);font-size:28px}
.crown{display:inline-block;font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.08em;margin-bottom:2px}
@keyframes flip{0%{transform:perspective(600px) rotateX(-80deg);opacity:0}100%{transform:none;opacity:1}}
.reveal-bar{display:flex;justify-content:center;margin-top:20px}
.champ{text-align:center;padding:8px 0 24px}
.champ .lbl{font-weight:800;color:var(--gold);letter-spacing:.12em;font-size:13px}
.champ .name{font-size:clamp(36px,9vw,64px);font-weight:900;letter-spacing:-.03em;line-height:1.1;margin:6px 0 4px;text-wrap:balance}
.champ .votes{font-family:var(--mono);color:var(--muted)}
.log{margin-top:28px;border-top:1px solid var(--line);padding-top:20px}
.log summary{cursor:pointer;font-weight:700}
.tbl{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:700}
td.mono{color:var(--muted)}
.end{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:28px}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="top">
    <div class="brand"><i>H</i>HTRO EDU <span>· 교실 투표</span></div>
    <div class="row" style="gap:8px"><button class="btn sm ghost" id="snd" aria-pressed="true">소리 켜짐</button><nav class="steps" id="steps" aria-label="진행 단계"></nav></div>
  </header>
  <main id="app"></main>
</div>

<script>
const KEY='htro-vote-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({phase:'setup',title:'2학년 3반 반장 선거',candidates:['김도윤','이서아','박하준'],voters:25,votes:[],tick:0,handoff:false,example:true});
let S; try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){} if(!S||!S.phase)S=fresh();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let sel=null, ask=null, err='';

function steps(){
  const order=['setup','vote','result'], lab=['설정','투표','개표'], i=order.indexOf(S.phase);
  $('#steps').innerHTML=lab.map((l,k)=>`<b class="${k===i?'on':k<i?'done':''}">${l}</b>`).join('');
}
function render(){steps();({setup:rSetup,vote:rVote,result:rResult})[S.phase]();save();}

/* ---------- 설정 ---------- */
function rSetup(){
  $('#app').innerHTML=`<section class="card setup">
    <div><h1>새 투표 만들기</h1><p class="sub">후보 이름과 투표 인원을 정하면 한 사람씩 번호를 눌러 투표해요. 1인 1표, 기권할 수 있어요.</p></div>
    <div class="field"><p class="label"><label for="title">투표 제목</label></p><input type="text" id="title" value="${esc(S.title)}" maxlength="40" placeholder="예: 학급 회장 선거"></div>
    <div class="field"><p class="label">후보 (${S.candidates.length}명)</p>
      <div class="cands">${S.candidates.map((c,i)=>`<div class="cand"><span class="no">${i+1}</span>
        <input type="text" id="c${i}" data-i="${i}" value="${esc(c)}" maxlength="20" placeholder="${i+1}번 후보 이름" aria-label="${i+1}번 후보 이름">
        <button class="icon-btn" data-del="${i}" aria-label="${i+1}번 후보 삭제" ${S.candidates.length<=2?'disabled':''}>×</button></div>`).join('')}</div>
      ${S.candidates.length<12?'<button class="add" id="add">+ 후보 추가</button>':''}
      ${S.example?'<p class="note">예시 이름이 들어가 있어요. 실제 후보로 바꿔 주세요.</p>':''}
    </div>
    <div class="field"><p class="label"><label for="voters">투표 인원</label></p>
      <div class="row"><div class="stepper"><button id="minus" aria-label="한 명 줄이기">−</button><input id="voters" inputmode="numeric" value="${S.voters}"><button id="plus" aria-label="한 명 늘리기">+</button></div>
      <span class="sub" style="margin:0">명이 한 번씩 투표해요</span></div></div>
    <p class="err" id="err">${esc(err)}</p>
    <button class="btn big full" id="start">투표 시작</button>
  </section>`;
  $('#title').oninput=e=>{S.title=e.target.value;save()};
  document.querySelectorAll('.cand input').forEach(el=>el.oninput=e=>{S.candidates[+e.target.dataset.i]=e.target.value;S.example=false;save()});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.candidates.splice(+b.dataset.del,1);render()});
  const add=$('#add'); if(add)add.onclick=()=>{S.candidates.push('');S.example=false;render();$('#c'+(S.candidates.length-1)).focus()};
  const setV=v=>{S.voters=Math.max(1,Math.min(999,v|0||1));$('#voters').value=S.voters;save()};
  $('#minus').onclick=()=>setV(S.voters-1); $('#plus').onclick=()=>setV(S.voters+1);
  $('#voters').onchange=e=>setV(parseInt(e.target.value,10));
  $('#start').onclick=()=>{
    const names=S.candidates.map(s=>s.trim());
    if(names.some(n=>!n)){err='비어 있는 후보 이름을 채우거나 그 칸을 지워 주세요.';return render()}
    if(new Set(names).size!==names.length){err='같은 이름의 후보가 있어요. 이름을 구분해 주세요.';return render()}
    if(!S.title.trim())S.title='투표';
    err='';S.candidates=names;S.votes=[];S.tick=0;S.handoff=false;S.phase='vote';sel=null;render();
  };
}

/* ---------- 투표 ---------- */
function rVote(){
  const done=S.votes.length, N=S.voters;
  if(S.handoff){
    const last=done>=N;
    $('#app').innerHTML=`<section class="card handoff">
      <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h1>${last?'모든 투표가 끝났어요':'투표가 완료되었어요'}</h1>
      <p class="sub">${last?`${N}명 모두 투표했어요. 개표를 시작해 볼까요?`:`<span class="mono">${done} / ${N}</span>명 투표 완료 · 다음 사람 차례예요`}</p>
      ${last?'<button class="btn big" id="next">개표하러 가기</button>':''}
    </section>`;
    if(last){$('#next').onclick=()=>{S.handoff=false;S.phase='result';S.tick=0;render()};$('#next').focus()}
    else if(!flashTimer){S.handoff=false;return rVote()}
    return;
  }
  const pct=done/N*100;
  $('#app').innerHTML=`<section class="card">
    <div class="vhead"><div><p class="label">투표 진행 중</p><h1>${esc(S.title)}</h1></div>
      <div class="counter"><div class="n">${String(done).padStart(2,'0')}<em> / ${N}</em></div><small>명 투표 완료</small></div></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <p class="turn"><span class="mono">${done+1}번째</span> 투표자, 번호를 눌러 주세요</p>
    <div class="grid">${S.candidates.map((c,i)=>`<button class="opt" data-c="${i}"><span class="k">${i+1}</span><span class="nm">${esc(c)}</span></button>`).join('')}</div>
    <button class="abst" data-c="-1">기권하기</button>
    <p class="keys">누르는 즉시 투표돼요 · 키보드 <kbd>1</kbd>–<kbd>${Math.min(9,S.candidates.length)}</kbd> 후보 · <kbd>0</kbd> 기권</p>
  </section>
  <div class="tools">${toolBar()}</div>`;
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>cast(+b.dataset.c));
  bindTools();
}
function toolBar(){
  if(ask==='undo')return `<span class="ask">마지막 표를 취소할까요? <button class="btn sm danger" id="yes">취소하기</button><button class="btn sm ghost" id="no">아니요</button></span>`;
  if(ask==='end')return `<span class="ask">${S.voters-S.votes.length}명이 남았어요. 지금 마감할까요? <button class="btn sm danger" id="yes">마감하기</button><button class="btn sm ghost" id="no">아니요</button></span>`;
  return `<button class="btn sm ghost" id="undo" ${S.votes.length?'':'disabled'}>마지막 표 취소</button><button class="btn sm ghost" id="end" ${S.votes.length?'':'disabled'}>여기서 마감</button>`;
}
function bindTools(){
  const b=(id,f)=>{const el=$('#'+id);if(el)el.onclick=f};
  b('undo',()=>{ask='undo';rVote()}); b('end',()=>{ask='end';rVote()}); b('no',()=>{ask=null;rVote()});
  b('yes',()=>{ if(ask==='undo'){S.votes.pop();ask=null;sel=null;render()} else {ask=null;S.voters=S.votes.length;S.phase='result';S.tick=0;render()} });
}
let flashTimer=null;
function cast(c){
  if(S.handoff||flashTimer||S.votes.length>=S.voters)return;
  S.votes.push({c,t:Date.now()});ask=null;S.handoff=true;
  const last=S.votes.length>=S.voters;
  last?sfx.allDone():sfx.vote();
  if(!last)flashTimer=setTimeout(()=>{flashTimer=null;S.handoff=false;render()},1000);
  render();
}
document.addEventListener('keydown',e=>{
  if(S.phase==='vote'){
    if(e.target.tagName==='INPUT'||e.repeat)return;
    if(/^[0-9]$/.test(e.key)){const n=+e.key; if(n===0)cast(-1); else if(n<=S.candidates.length)cast(n-1)}
  } else if(S.phase==='result'&&(e.key===' '||e.key==='ArrowUp')&&document.activeElement?.id!=='again'){
    const b=$('#reveal'); if(b){e.preventDefault();b.click()}
  }
});

/* ---------- 개표 ---------- */
function tally(){
  const cnt=S.candidates.map(()=>0); let abst=0;
  S.votes.forEach(v=>v.c<0?abst++:cnt[v.c]++);
  const rows=S.candidates.map((n,i)=>({n,i,v:cnt[i]})).sort((a,b)=>b.v-a.v||a.i-b.i);
  rows.forEach((r,k)=>r.rank=k&&rows[k-1].v===r.v?rows[k-1].rank:k+1);
  const ranks=[...new Set(rows.map(r=>r.rank))].sort((a,b)=>b-a); // 아래 순위부터 공개
  return {rows,abst,ranks,max:Math.max(1,...cnt),top:Math.max(0,...cnt)};
}
let autoTimer=null;
function runCount(){
  const T=tally();
  const step=()=>{
    S.tick++;
    const done=S.tick>=T.top;
    // 아직 올라가는 후보는 모두 같은 표수(동점). 다음 표에서 멈추는 후보와 계속 가는 후보로 갈리면 멈춤
    const rising=T.rows.filter(r=>r.v>=S.tick);
    const settledTie=rising.length>=2&&rising.some(r=>r.v===S.tick)&&rising.some(r=>r.v>S.tick);
    autoTimer=(done||settledTie)?null:setTimeout(step,1500);
    render();
    if(done){sfx.win();fireworks(7000)} else if(settledTie)sfx.tie(); else sfx.tick();
  };
  autoTimer=setTimeout(step,0);
  render();
}
function rResult(){
  if(typeof S.tick!=='number')S.tick=0;
  const T=tally(), total=S.votes.length, all=S.tick>=T.top&&(S.tick>0||T.top===0);
  const t=S.tick, pausedTie=!all&&t>0&&!autoTimer;
  const winners=T.rows.filter(r=>r.rank===1);
  const champ=all?`<div class="champ"><div class="lbl">${winners.length>1?'공동 우승':'최종 우승'}</div>
      <div class="name">${winners.map(w=>esc(w.n)).join(' · ')}</div>
      <div class="votes">${winners[0].v}표 · 유효표의 ${total-T.abst?Math.round(winners[0].v/(total-T.abst)*100):0}%</div></div>`:'';
  // 개표 중에는 후보 번호 순서 고정, 끝나면 순위 순서
  const list=all?T.rows:[...T.rows].sort((a,b)=>a.i-b.i);
  $('#app').innerHTML=`<section class="card">
    ${champ}
    <div class="rhead"><div><p class="label">${all?'개표 완료':t?'개표 중':'개표 준비'}</p><h1>${esc(S.title)}</h1></div>
      <div class="stats"><span class="chip">투표 <span class="mono">${total}</span>명</span><span class="chip">유효 <span class="mono">${total-T.abst}</span></span><span class="chip">기권 <span class="mono">${T.abst}</span></span></div></div>
    <div class="board">${list.map(r=>{
      const cur=Math.min(r.v,t), prev=Math.min(r.v,Math.max(0,t-1));
      const fin=t>0&&r.v<t, win=all&&r.rank===1, tieNow=pausedTie&&r.v>=t;
      return `<div class="rk ${win?'win':''} ${tieNow?'tie':''} ${fin&&!win?'fin':''}">
        <div class="pos">${all||fin?`${r.rank}<small>위</small>`:`<span class="num">${r.i+1}</span><small>번</small>`}</div>
        <div class="who">${win?'<span class="crown">WINNER</span>':tieNow?'<span class="crown tie-lbl">동점</span>':''}<b>${esc(r.n)}</b><div class="track"><i style="width:${prev/T.max*100}%" data-w="${cur/T.max*100}"></i></div></div>
        <div class="cnt">${cur}<small>표</small></div></div>`}).join('')}</div>
    ${all?'':`<div class="reveal-bar"><button class="btn big" id="reveal" ${autoTimer?'disabled':''}>${autoTimer?'개표 중…':t===0?'개표 시작':'동점! 계속 개표'}</button></div>
      <p class="keys" style="text-align:center">모든 후보가 한 표씩 함께 올라가요 · 동점이 갈리기 직전에 멈춰요 · <kbd>Space</kbd> 계속</p>`}
    ${all?`<details class="log"><summary>투표 기록 보기 (${total}건)</summary><div class="tbl"><table>
      <thead><tr><th>순서</th><th>선택</th><th>시각</th></tr></thead><tbody>
      ${S.votes.map((v,k)=>`<tr><td class="mono">${k+1}</td><td>${v.c<0?'<span style="color:var(--muted)">기권</span>':`${v.c+1}번 ${esc(S.candidates[v.c])}`}</td><td class="mono">${new Date(v.t).toLocaleTimeString('ko-KR',{hour12:false})}</td></tr>`).join('')}
      </tbody></table></div></details>
      <div class="end"><button class="btn ghost" id="boom">폭죽 다시 보기</button><button class="btn ghost" id="replay">개표 다시 하기</button><button class="btn" id="again">새 투표 만들기</button></div>`:''}
  </section>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.track i').forEach(i=>i.style.width=i.dataset.w+'%')));
  const r=$('#reveal'); if(r){r.onclick=()=>{if(!autoTimer)runCount()};if(!autoTimer)r.focus()}
  const b=(id,f)=>{const el=$('#'+id);if(el)el.onclick=f};
  b('boom',()=>fireworks(5000));
  b('replay',()=>{clearTimeout(autoTimer);autoTimer=null;S.tick=0;render()});
  b('again',()=>{const t=S.title,c=S.candidates,v=S.voters;S=fresh();Object.assign(S,{title:t,candidates:c,voters:v,example:false});render()});
}

/* ---------- 폭죽 ---------- */
const cv=$('#fx'), cx=cv.getContext('2d');
let parts=[], rockets=[], until=0, running=false, lastSpawn=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const palette=['#3654F4','#6E85FF','#F2B84B','#FF5C7A','#3FD0A8','#FFFFFF','#B48CFF'];
function size(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',size);size();
function burst(x,y){
  sfx.pop();
  const col=palette[Math.random()*palette.length|0], col2=palette[Math.random()*palette.length|0], n=reduce?40:90;
  for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.2, s=2+Math.random()*4.5;
    parts.push({x,y,px:x,py:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:.008+Math.random()*.012,c:Math.random()<.7?col:col2})}
}
function fireworks(ms){
  size(); until=performance.now()+(reduce?1200:ms);
  for(let i=0;i<3;i++)setTimeout(()=>burst(innerWidth*(.2+.3*i),innerHeight*(.25+Math.random()*.15)),i*180);
  if(!running){running=true;requestAnimationFrame(loop)}
}
function loop(t){
  if(t<until&&t-lastSpawn>(reduce?600:260)){lastSpawn=t;
    rockets.push({x:innerWidth*(.1+Math.random()*.8),y:innerHeight,vy:-(9+Math.random()*4),ty:innerHeight*(.12+Math.random()*.35),c:palette[Math.random()*palette.length|0]})}
  cx.clearRect(0,0,innerWidth,innerHeight);
  cx.globalCompositeOperation='lighter';
  rockets=rockets.filter(r=>{const py=r.y;r.y+=r.vy;r.vy*=.985;
    cx.strokeStyle=r.c;cx.lineWidth=2;cx.beginPath();cx.moveTo(r.x,py+8);cx.lineTo(r.x,r.y);cx.stroke();
    if(r.y<=r.ty||r.vy>-1.5){burst(r.x,r.y);return false}return true});
  parts=parts.filter(p=>{p.px=p.x;p.py=p.y;p.vx*=.985;p.vy=p.vy*.985+.06;p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;
    if(p.life<=0)return false;
    cx.globalAlpha=p.life;cx.strokeStyle=p.c;cx.lineWidth=2.2;cx.beginPath();cx.moveTo(p.px,p.py);cx.lineTo(p.x,p.y);cx.stroke();return true});
  cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
  if(t<until||parts.length||rockets.length)requestAnimationFrame(loop);else{running=false;cx.clearRect(0,0,innerWidth,innerHeight)}
}

/* ---------- 효과음 (Web Audio로 직접 합성) ---------- */
let AC=null, muted=false, lastPop=0;
try{muted=localStorage.getItem(KEY+'-mute')==='1'}catch(e){}
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
addEventListener('pointerdown',ac);addEventListener('keydown',ac);
function tone(f,at,dur,type='sine',vol=.18,slide){
  const a=ac(); if(!a||muted)return;
  const t=a.currentTime+at, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
function noise(at,dur,vol,freq){
  const a=ac(); if(!a||muted)return;
  const t=a.currentTime+at, len=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5);
  const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  s.buffer=buf; f.type='bandpass'; f.frequency.value=freq; f.Q.value=.8; g.gain.value=vol;
  s.connect(f).connect(g).connect(a.destination); s.start(t);
}
const sfx={
  vote(){tone(988,0,.12,'sine',.2);tone(1480,.07,.28,'sine',.16)},
  allDone(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.5,'triangle',.2));[523,659,784].forEach(f=>tone(f,.48,1.1,'sine',.1))},
  tick(){tone(1200,0,.05,'square',.04)},
  tie(){noise(0,.25,.9,140);tone(98,0,.45,'triangle',.35,82);noise(.32,.25,.9,140);tone(92,.32,.8,'triangle',.35,70);tone(740,.35,.9,'sine',.07);tone(784,.35,.9,'sine',.07)},
  win(){
    const n=[[392,0,.14],[523,.15,.14],[659,.3,.14],[784,.45,.3],[659,.78,.14],[784,.93,1.4]];
    n.forEach(([f,t,d])=>{tone(f,t,d+.1,'square',.07);tone(f*2,t,d+.1,'triangle',.08)});
    [523,659,784,1047].forEach(f=>tone(f,.93,1.6,'sine',.09));
    noise(.93,.6,.5,3000);
  },
  pop(){const now=performance.now(); if(now-lastPop<120)return; lastPop=now; noise(0,.35,1.1,600+Math.random()*900); noise(.03,.6,.25,5000)}
};
function sndBtn(){const b=$('#snd');b.textContent=muted?'소리 꺼짐':'소리 켜짐';b.setAttribute('aria-pressed',String(!muted))}
$('#snd').onclick=()=>{muted=!muted;try{localStorage.setItem(KEY+'-mute',muted?'1':'0')}catch(e){}sndBtn();if(!muted)sfx.vote()};
sndBtn();

render();
</script>
